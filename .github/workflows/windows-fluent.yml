# Simpl for Windows, made again in Windows 11's look (windows/SimplFluent: WPF with WPF-UI — Mica, the Settings app's
# navigation and cards, Fluent icons): built on a Windows runner, pictured against the mock Canvas, and — when a commit
# asks for it with "[preview]" in its message, or by hand (Run workflow) — published as a pre-release
# (windows-fluent-v<run>, zero-padded) to try on a real PC. The first Windows app (windows/Simpl, windows-app-v*) and
# Simpl's Mac and iPhone builds, releases and update feeds are not touched.
name: Windows app (Windows 11 look)

on:
  push:
    branches: [claude/windows-liquid-glass]
    paths:
      - 'windows/SimplFluent/**'
      - '.github/workflows/windows-fluent.yml'
  workflow_dispatch:
    inputs:
      preview:
        description: Publish the build as a preview release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: windows-fluent
  cancel-in-progress: true

jobs:
  app:
    name: Simpl for Windows (Windows 11 look)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build (Release, win-x64, self-contained)
        shell: bash
        run: |
          # (the build carries its run's number — "0.2.0 (v003)" — as About and Updates name it)
          n=$(printf '%03d' "${{ github.run_number }}")
          dotnet publish windows/SimplFluent/SimplFluent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/Simpl -nologo "-p:InformationalVersion=0.2.0 (v$n)"
          test -f dist/Simpl/Simpl.exe
      - name: Mock Canvas
        shell: bash
        run: |
          node scripts/dev/mock-canvas.mjs 8800 8801 > mock.log 2>&1 &
          # (a second one that asks for a sign-in first: the sign-in pictures)
          node scripts/dev/mock-canvas.mjs 8802 8803 --login > mock-login.log 2>&1 &
          sleep 3
          curl -s -o /dev/null -w "mock %{http_code}\n" http://localhost:8800/
          curl -s -o /dev/null -w "mock sign-in %{http_code}\n" http://localhost:8802/login/canvas
      - name: Pictures
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; Write-Host "display 1920x1080" } catch { Write-Host "display left as it is: $_" }
          New-Item -ItemType Directory -Force shots | Out-Null
          $jobs = @()
          function Shot($name, $size, $wait, $extra) {
            $prof = Join-Path $env:RUNNER_TEMP "profile-$name"
            $argList = @('--shot', "$PWD/shots/$name.png", '--shot-after', "$wait", '--profile', $prof, '--window-size', $size) + $extra
            $p = Start-Process -FilePath dist/Simpl/Simpl.exe -ArgumentList $argList -PassThru
            if (-not $p.WaitForExit(($wait + 40) * 1000)) { Stop-Process -Id $p.Id -Force; Write-Host "$name did not finish" }
            if (Test-Path "shots/$name.png") { Write-Host "shot $name" } else { Write-Host "no picture: $name" }
          }
          $mock = @('--base-url', 'http://localhost:8800', '--demo')
          $login = @('--base-url', 'http://localhost:8802', '--demo')
          # the first run: finding the school, and the school confirmed
          Shot 'school-picker-dark' '1024x681' 8 @('--appearance', 'dark')
          Shot 'school-picker-light' '1024x681' 8 @('--appearance', 'light')
          Shot 'school-search' '1024x681' 10 @('--appearance', 'light', '--picker-query', 'state uni')
          Shot 'school-confirm' '1024x681' 10 @('--appearance', 'dark', '--picker-query', 'state uni', '--picker-confirm')
          # signing in (the mock with --login): the card, a wrong password, "Logging you in", "Stay logged in?", a page
          # finished by hand (a one-time code)
          Shot 'sign-in-dark' '1024x681' 14 ($login + @('--appearance', 'dark'))
          Shot 'sign-in-light' '1024x681' 14 ($login + @('--appearance', 'light'))
          Shot 'sign-in-light-wide' '1366x778' 14 ($login + @('--appearance', 'light'))
          Shot 'sign-in-wrong' '1024x681' 16 ($login + @('--appearance', 'light', '--sign-in', 'student:wrong'))
          Shot 'sign-in-working' '1024x681' 14 ($login + @('--appearance', 'light', '--sign-in', 'slow:demo'))
          Shot 'sign-in-stay' '1024x681' 40 ($login + @('--appearance', 'dark', '--sign-in', 'student:demo'))
          Shot 'sign-in-handoff' '1024x681' 18 ($login + @('--appearance', 'light', '--sign-in', 'code:demo'))
          # the app: the Dashboard (light, dark, the user's window size, narrow with the pane open), the account menu,
          # What's New
          Shot 'dashboard-dark' '1024x681' 45 ($mock + @('--appearance', 'dark'))
          Shot 'dashboard-light' '1024x681' 45 ($mock + @('--appearance', 'light'))
          Shot 'dashboard-light-wide' '1366x778' 45 ($mock + @('--appearance', 'light'))
          Shot 'dashboard-dark-wide' '1366x778' 45 ($mock + @('--appearance', 'dark'))
          Shot 'dashboard-cards-wide' '1366x778' 45 ($mock + @('--appearance', 'dark', '--dash-view', 'cards'))
          Shot 'dashboard-activity' '1024x681' 45 ($mock + @('--appearance', 'light', '--dash-view', 'activity'))
          Shot 'dashboard-counter' '1024x681' 45 ($mock + @('--appearance', 'light', '--sheet', 'next'))
          Shot 'dashboard-narrow' '780x683' 45 ($mock + @('--appearance', 'light'))
          Shot 'dashboard-narrow-pane' '780x683' 45 ($mock + @('--appearance', 'dark', '--pane-open'))
          Shot 'course-open' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'course:101'))
          Shot 'account-menu' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'menu'))
          Shot 'whats-new' '1024x681' 45 ($mock + @('--appearance', 'dark', '--open', 'whatsnew'))
          Get-ChildItem $env:RUNNER_TEMP -Filter 'profile-*' -Directory | ForEach-Object {
            $log = Join-Path $_.FullName 'simpl.log'
            if (Test-Path $log) { Copy-Item $log "shots/$($_.Name).log"; Write-Host "--- $($_.Name)"; Get-Content $log -Tail 25 }
          }
          Get-ChildItem shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-fluent-shots
          path: shots
      - name: Zip
        shell: bash
        run: (cd dist && 7z a -tzip -mx=7 ../Simpl-Windows-x64.zip Simpl >/dev/null) && ls -la Simpl-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Simpl-Windows-x64
          path: Simpl-Windows-x64.zip

  publish:
    name: Publish the preview
    needs: [app]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.preview) || contains(github.event.head_commit.message, '[preview]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Simpl-Windows-x64
          path: zips
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(printf '%03d' "${{ github.run_number }}")
          tag="windows-fluent-v$n"
          gh release create "$tag" zips/*.zip --target "${{ github.sha }}" --prerelease \
            --title "Simpl for Windows — Windows 11 look, preview (v$n)" \
            --notes-file windows/SimplFluent/RELEASE_NOTES.md
          echo "https://github.com/${{ github.repository }}/releases/tag/$tag"
