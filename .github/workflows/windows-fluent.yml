          if ($script:mine -contains 'bio-cell-pointer') {
            $pointed = $null
            foreach ($l in @(Get-Content 'shots/profile-bio-cell-pointer.log' -ErrorAction SilentlyContinue)) {
              if ($l -match ' picture at ') { break }
              if ($l -match 'bio scene: pointed at (\S+)') { $pointed = $Matches[1] }
            }
            if ($pointed) { Write-Host "::error::bio-cell-pointer: '$pointed' showed as pointed at under a still pointer (shots/profile-bio-cell-pointer.log)"; exit 1 }
            Write-Host "bio-cell-pointer: nothing pointed at"
          }
          # an outside tool's page in light in a dark app whose web profile prefers dark (Shell/WebWindow.cs, LightPages: the
          # tool window writes "web window: the page prefers …" in a picture run as each page comes in)
          if ($script:mine -contains 'tool-window-light') {
            $said = @(Select-String -Path 'shots/profile-tool-window-light.log' -Pattern 'web window: the page prefers (\w+)' -ErrorAction SilentlyContinue | ForEach-Object { $_.Matches[0].Groups[1].Value })
            if ($said.Count -eq 0 -or $said -contains 'dark') { Write-Host "::error::tool-window-light: the tool's page did not prefer light ($($said -join ', ')) (shots/profile-tool-window-light.log)"; exit 1 }
            Write-Host "tool-window-light: the page prefers $($said -join ', ')"
          }
          # and a tool's page framing another site's page, each with a dark look of its own: the page and its frame — a
          # frame in a process of its own, held at its start until told — both prefer light (LightPages writes "web window:
          # a frame prefers …" in a picture run as each frame comes in)
          if ($script:mine -contains 'tool-window-framed') {
            $framedLog = 'shots/profile-tool-window-framed.log'
            $page = @(Select-String -Path $framedLog -Pattern 'web window: the page prefers (\w+)' -ErrorAction SilentlyContinue | ForEach-Object { $_.Matches[0].Groups[1].Value })
            $frames = @(Select-String -Path $framedLog -Pattern 'web window: a frame prefers (\w+)' -ErrorAction SilentlyContinue | ForEach-Object { $_.Matches[0].Groups[1].Value })
            if ($page.Count -eq 0 -or $page -contains 'dark' -or $frames.Count -eq 0 -or $frames -contains 'dark') { Write-Host "::error::tool-window-framed: the tool's page ($($page -join ', ')) or its frame ($($frames -join ', ')) did not prefer light ($framedLog)"; exit 1 }
            Write-Host "tool-window-framed: the page prefers $($page -join ', '); its frames $($frames -join ', ')"
          }
