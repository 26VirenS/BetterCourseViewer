<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<link rel="stylesheet" href="solver.css">
<script src="../../lib/vendor/katex/katex.min.js"></script>
<script src="../../lib/vendor/katex/katex-css.js"></script>
<script src="core.js"></script>
<script src="algebra.js"></script>
<script src="calculus.js"></script>
<script src="solver.js"></script>
</head>
<body>
<div id="app">
  <main id="thread" class="thread" aria-live="polite">
    <div id="hello" class="hello">
      <div class="hello-mark">∑</div>
      <h1>Calculator</h1>
      <p>Type a maths problem below, or build it with the keypad. Simpl works it out, step by step.</p>
      <div class="examples" id="examples"></div>
    </div>
  </main>

  <footer class="composer">
    <div class="bar">
      <div class="inputwrap">
        <div id="preview" class="preview" aria-hidden="true"></div>
        <input id="q" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Enter a problem" placeholder="Enter a problem…">
      </div>
      <button id="clear" class="round ghost" title="Clear" aria-label="Clear" hidden>✕</button>
      <button id="kbToggle" class="round ghost" title="Keypad" aria-label="Show or hide the keypad" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12.5" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M6.5 13.5h.01M17.5 13.5h.01M9.5 14.5h5"/></svg></button>
      <button id="go" class="round send" title="Solve (Return)" aria-label="Solve">➤</button>
    </div>
    <div id="keypad" class="keypad">
      <div class="ktabs" role="tablist">
        <button class="ktab on" data-tab="basic">Basic</button>
        <button class="ktab" data-tab="algebra">Algebra</button>
        <button class="ktab" data-tab="trig">Trigonometry</button>
        <button class="ktab" data-tab="calc">Calculus</button>
      </div>
      <div class="keys" id="keys"></div>
    </div>
  </footer>
</div>
<script src="ui.js"></script>
</body>
</html>
