<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set up Simpl Courses</title>
  <script src="setup-css.js"></script>
  <script src="style-tag.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <i class="blob blob--a"></i><i class="blob blob--b"></i><i class="blob blob--c"></i><i class="blob blob--d"></i>
  </div>

  <main class="page">
    <header class="top">
      <span class="mark mark--sm" aria-hidden="true">
        <svg viewBox="0 0 120 120" width="23" height="23">
          <defs><linearGradient id="sheetSm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
          <rect x="16" y="18" width="53" height="84" rx="14" fill="url(#sheetSm)"/>
          <path d="M28 30 H69 A30 30 0 0 1 69 90 H28" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M35 42 H69 A18 18 0 0 1 69 78 H35" fill="none" stroke="rgba(255,255,255,.72)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M42 54 H69 A6 6 0 0 1 69 66 H42" fill="none" stroke="rgba(255,255,255,.46)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="top__name">Simpl Courses</span>
    </header>

    <section class="card" id="card" aria-live="polite">
      <div class="card__body" id="body"></div>
      <footer class="foot" id="foot"></footer>
    </section>
  </main>

  <script src="../lib/settings.js"></script>
  <script src="../lib/utils.js"></script>
  <script src="setup.js"></script>
</body>
</html>
