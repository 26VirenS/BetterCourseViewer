            $alone = Start-Process -FilePath dist/Simpl/Simpl.exe -ArgumentList $argList -PassThru
            if (-not $alone.WaitForExit(120000)) { Stop-Process -Id $alone.Id -Force -ErrorAction SilentlyContinue }
