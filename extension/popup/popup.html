<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simpl Courses</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img src="../icons/icon-48.png" width="28" height="28" alt="">
    <div class="head__text">
      <div class="head__title">Simpl Courses</div>
      <div class="head__sub" id="status">Checking this tab…</div>
    </div>
    <button class="iconbtn" id="open-settings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9a3 3 0 100 6 3 3 0 000-6zM4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"/></svg>
    </button>
  </header>

  <section class="card card--setup" id="setup-card" hidden>
    <div class="card__title">Set it up first</div>
    <p class="muted">A few short steps: your Canvas address, the courses you want to see, your grades, the smart panel, and a tour.</p>
    <button class="btn btn--primary btn--wide" id="start-setup">Start setup</button>
  </section>

  <section class="card" id="enable-card" hidden>
    <div class="card__title">Not enabled on this site</div>
    <p class="muted">If this is your school's Canvas, turn Simpl Courses on for it.</p>
    <button class="btn btn--primary" id="enable-site">Enable on <span id="enable-host"></span></button>
    <p class="muted small" id="enable-msg"></p>
  </section>

  <section class="section">
    <label class="row switchrow">
      <span class="row__label"><strong>Simpl Courses look</strong><span class="muted small">The new interface. Off shows stock Canvas.</span></span>
      <span class="switch"><input type="checkbox" id="skin"><span class="switch__track"><span class="switch__knob"></span></span></span>
    </label>
    <label class="row">
      <span class="row__label">Appearance</span>
      <select id="darkMode" class="select">
        <option value="system">Match system</option>
        <option value="off">Light</option>
        <option value="on">Dark</option>
      </select>
    </label>
  </section>

  <footer class="foot">
    <div class="foot__status muted" id="smart-status">Smart panel: …</div>
    <div class="foot__row">
      <span id="version" class="muted" title="Simpl Courses version"></span>
      <span class="foot__links">
        <a href="#" id="foot-setup" title="Courses, grades, the smart panel and a tour">Guided setup</a>
        <a href="#" id="foot-settings">Settings</a>
      </span>
    </div>
  </footer>

  <script src="../lib/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
