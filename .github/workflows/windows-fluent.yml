# Simpl for Windows, made again in Windows 11's look (windows/SimplFluent: WPF with WPF-UI — Mica, the Settings app's
# navigation and cards, Fluent icons): built on a Windows runner, pictured against the mock Canvas, and — when a commit
# asks for it with "[preview]" in its message, or by hand (Run workflow) — published as a pre-release
# (windows-fluent-v<run>, zero-padded) to try on a real PC. The first Windows app (windows/Simpl, windows-app-v*) and
# Simpl's Mac and iPhone builds, releases and update feeds are not touched.
name: Windows app (Windows 11 look)

on:
  push:
    branches: [claude/windows-liquid-glass]
    paths:
      - 'windows/SimplFluent/**'
      - '.github/workflows/windows-fluent.yml'
  workflow_dispatch:
    inputs:
      preview:
        description: Publish the build as a preview release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: windows-fluent
  cancel-in-progress: false

jobs:
  app:
    name: Simpl for Windows (Windows 11 look)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build (Release, win-x64, self-contained)
        shell: bash
        run: |
          # (the build carries its run's number — "0.2.0 (v003)" — as About and Updates name it)
          n=$(printf '%03d' "${{ github.run_number }}")
          dotnet publish windows/SimplFluent/SimplFluent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/Simpl -nologo "-p:InformationalVersion=0.2.0 (v$n)"
          test -f dist/Simpl/Simpl.exe
      - name: Mock Canvas
        shell: bash
        run: |
          node scripts/dev/mock-canvas.mjs 8800 8801 > mock.log 2>&1 &
          # (a second one that asks for a sign-in first: the sign-in pictures)
          node scripts/dev/mock-canvas.mjs 8802 8803 --login > mock-login.log 2>&1 &
          sleep 3
          curl -s -o /dev/null -w "mock %{http_code}\n" http://localhost:8800/
          curl -s -o /dev/null -w "mock sign-in %{http_code}\n" http://localhost:8802/login/canvas
      - name: Pictures
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; Write-Host "display 1920x1080" } catch { Write-Host "display left as it is: $_" }
          New-Item -ItemType Directory -Force shots | Out-Null
          # (three at a time, each with a profile of its own: each copy of Simpl pictures its own window, then quits)
          $script:running = @()
          function Shot($name, $size, $wait, $extra) {
            while (@($script:running | Where-Object { -not $_.HasExited }).Count -ge 3) { Start-Sleep -Milliseconds 400 }
            $prof = Join-Path $env:RUNNER_TEMP "profile-$name"
            $argList = @('--shot', "$PWD/shots/$name.png", '--shot-after', "$wait", '--profile', $prof, '--window-size', $size) + $extra
            $script:running += Start-Process -FilePath dist/Simpl/Simpl.exe -ArgumentList $argList -PassThru
          }
          $mock = @('--base-url', 'http://localhost:8800', '--demo')
          $login = @('--base-url', 'http://localhost:8802', '--demo')
          # the first run: finding the school, and the school confirmed
          Shot 'school-picker-dark' '1024x681' 8 @('--appearance', 'dark')
          Shot 'school-picker-light' '1024x681' 8 @('--appearance', 'light')
          Shot 'school-search' '1024x681' 10 @('--appearance', 'light', '--picker-query', 'state')
          Shot 'school-confirm' '1024x681' 10 @('--appearance', 'dark', '--picker-query', 'state', '--picker-confirm')
          # signing in (the mock with --login): the card, a wrong password, "Logging you in", "Stay logged in?", a page
          # finished by hand (a one-time code)
          Shot 'sign-in-dark' '1024x681' 14 ($login + @('--appearance', 'dark'))
          Shot 'sign-in-light' '1024x681' 14 ($login + @('--appearance', 'light'))
          Shot 'sign-in-light-wide' '1366x778' 14 ($login + @('--appearance', 'light'))
          Shot 'sign-in-wrong' '1024x681' 16 ($login + @('--appearance', 'light', '--sign-in', 'student:wrong'))
          Shot 'sign-in-working' '1024x681' 14 ($login + @('--appearance', 'light', '--sign-in', 'slow:demo'))
          Shot 'sign-in-stay' '1024x681' 40 ($login + @('--appearance', 'dark', '--sign-in', 'student:demo'))
          Shot 'sign-in-handoff' '1024x681' 18 ($login + @('--appearance', 'light', '--sign-in', 'code:demo'))
          # the app: the Dashboard (light, dark, the user's window size, narrow with the pane open), the account menu,
          # What's New
          Shot 'dashboard-dark' '1024x681' 45 ($mock + @('--appearance', 'dark'))
          Shot 'dashboard-light' '1024x681' 45 ($mock + @('--appearance', 'light'))
          Shot 'dashboard-light-wide' '1366x778' 45 ($mock + @('--appearance', 'light'))
          Shot 'dashboard-dark-wide' '1366x778' 45 ($mock + @('--appearance', 'dark'))
          Shot 'dashboard-cards-wide' '1366x778' 45 ($mock + @('--appearance', 'dark', '--dash-view', 'cards'))
          Shot 'dashboard-activity' '1024x681' 45 ($mock + @('--appearance', 'light', '--dash-view', 'activity'))
          Shot 'dashboard-counter' '1024x681' 45 ($mock + @('--appearance', 'light', '--sheet', 'next'))
          Shot 'dashboard-narrow' '780x683' 45 ($mock + @('--appearance', 'light'))
          Shot 'dashboard-narrow-pane' '780x683' 45 ($mock + @('--appearance', 'dark', '--pane-open'))
          Shot 'course-open' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'course:101'))
          Shot 'account-menu' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'menu'))
          Shot 'whats-new' '1024x681' 45 ($mock + @('--appearance', 'dark', '--open', 'whatsnew'))
          Shot 'setup' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'setup'))
          Shot 'preview' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'preview'))
          Shot 'tour-start' '1024x681' 45 ($mock + @('--appearance', 'dark', '--open', 'tour'))
          Shot 'tour-counter' '1366x778' 45 ($mock + @('--appearance', 'light', '--open', 'tour:12'))
          Shot 'theme-dusk' '1366x778' 45 ($mock + @('--appearance', 'dark', '--theme', 'Dusk'))
          # To Do, Calendar, Notifications
          Shot 'todo' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'todo'))
          Shot 'todo-wide' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'todo'))
          Shot 'todo-preview' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'todo', '--open', 'preview'))
          Shot 'new-task' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'todo', '--open', 'newtask'))
          Shot 'calendar' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'calendar'))
          Shot 'calendar-wide' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'calendar'))
          Shot 'calendar-week' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'calendar', '--cal-view', 'week'))
          Shot 'calendar-list' '1024x681' 45 ($mock + @('--appearance', 'dark', '--place', 'calendar', '--cal-view', 'list'))
          Shot 'calendar-preview' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'calendar', '--open', 'preview'))
          Shot 'notifications' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'notifications'))
          Shot 'notifications-narrow' '1024x681' 45 ($mock + @('--appearance', 'dark', '--place', 'notifications'))
          # Grades, a course's grades and What-If
          Shot 'grades' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'grades'))
          Shot 'grades-narrow' '1024x681' 45 ($mock + @('--appearance', 'dark', '--place', 'grades'))
          Shot 'grades-scale' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'grades', '--open', 'grading-scale'))
          Shot 'course-grades' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'section:courses/101:grades'))
          Shot 'course-grades-whatif' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'section:courses/101:grades', '--what-if'))
          # Inbox, a conversation, New Message, Groups
          Shot 'inbox' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'inbox'))
          Shot 'inbox-reading' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'inbox', '--open', 'conversation:c2'))
          Shot 'inbox-narrow' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'inbox'))
          Shot 'compose' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'compose'))
          Shot 'groups' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'groups'))
          # All Courses, a group's home, a course's sections, a page, files
          Shot 'courses' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'courses'))
          Shot 'group-home' '1024x681' 45 ($mock + @('--appearance', 'dark', '--place', 'group:66729'))
          Shot 'section-announcements' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'section:courses/101:announcements'))
          Shot 'section-assignments' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'section:courses/101:assignments'))
          Shot 'section-modules' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'section:courses/102:modules'))
          Shot 'section-people' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'section:courses/101:people'))
          Shot 'section-files' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'section:courses/101:files', '--open', 'file:f1'))
          Shot 'page' '1024x681' 45 ($mock + @('--appearance', 'light', '--push', '/courses/101/pages/chapter-4-notes'))
          # Search, External Tools, Tools (pins in the title bar, a pin's flyout, a tool open), a discussion
          Shot 'search' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'search:discussion'))
          Shot 'search-start' '1024x681' 45 ($mock + @('--appearance', 'dark', '--place', 'search'))
          Shot 'palette-commands' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'palette:/'))
          Shot 'palette-course' '1024x681' 45 ($mock + @('--appearance', 'dark', '--open', 'palette:phys'))
          Shot 'palette-sum' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'palette:12*4'))
          Shot 'palette-grades' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'palette:/grades_'))
          Shot 'palette-narrow' '780x683' 45 ($mock + @('--appearance', 'dark', '--pane-open', '--open', 'palette:/'))
          Shot 'external-tools' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'externaltools'))
          Shot 'tools' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'tools', '--pin', 'calc,ptable,pomo'))
          Shot 'tools-pin' '1366x778' 45 ($mock + @('--appearance', 'dark', '--pin', 'calc,ptable,pomo', '--pin-open', 'calc'))
          Shot 'tool-open' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'tools', '--tool', 'calc'))
          Shot 'topic' '1024x681' 45 ($mock + @('--appearance', 'light', '--push', '/courses/101/discussion_topics/7003'))
          # an assignment: a quiz taken, work handed in late, its feedback, Hand In, the rubric
          Shot 'assignment-quiz' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'course:101', '--push', '/courses/101/assignments/1001'))
          Shot 'assignment-narrow' '780x683' 45 ($mock + @('--appearance', 'light', '--place', 'course:101', '--push', '/courses/101/assignments/1001'))
          Shot 'assignment-late' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'course:101', '--push', '/courses/101/assignments/1008'))
          Shot 'assignment-feedback' '1366x778' 50 ($mock + @('--appearance', 'light', '--place', 'course:101', '--push', '/courses/101/assignments/1008', '--open', 'feedback'))
          Shot 'assignment-held' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'course:101', '--push', '/courses/101/assignments/1006'))
          Shot 'hand-in' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'course:104', '--push', '/courses/104/assignments/4002', '--open', 'handin'))
          Shot 'assignment-rubric' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'course:104', '--push', '/courses/104/assignments/4001'))
          Shot 'rubric' '1366x778' 50 ($mock + @('--appearance', 'dark', '--place', 'course:104', '--push', '/courses/104/assignments/4001', '--open', 'rubric'))
          Shot 'rubric-grid' '1366x778' 50 ($mock + @('--appearance', 'light', '--place', 'course:104', '--push', '/courses/104/assignments/4001', '--open', 'rubric:grid'))
          # a quiz, taken in the app: its start, a question, the review, the feedback, an access code
          Shot 'quiz-intro' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'quiz:101:9011'))
          Shot 'quiz-question' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'quiz:101:9011:take'))
          Shot 'quiz-question-dark' '1366x778' 45 ($mock + @('--appearance', 'dark', '--open', 'quiz:101:9011:take:2'))
          Shot 'quiz-review' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'quiz:101:9011:review'))
          Shot 'quiz-feedback' '1366x778' 45 ($mock + @('--appearance', 'light', '--open', 'quiz:101:9001:feedback'))
          Shot 'quiz-code' '1024x681' 45 ($mock + @('--appearance', 'dark', '--open', 'quiz:102:10019'))
          Shot 'quiz-narrow' '860x681' 45 ($mock + @('--appearance', 'light', '--open', 'quiz:101:9011:take'))
          # Knewton Alta and Macmillan Achieve, in the app's own popups
          Shot 'alta-overview' '1366x778' 50 ($mock + @('--appearance', 'light', '--open', 'alta:104:4003'))
          Shot 'alta-start' '1366x778' 50 ($mock + @('--appearance', 'dark', '--open', 'alta:104:4004'))
          Shot 'macmillan' '1366x778' 50 ($mock + @('--appearance', 'light', '--open', 'macmillan:104:4005'))
          # Settings, as Windows 11's own Settings app, on each of its categories
          foreach ($tab in @('general', 'appearance', 'notifications', 'grades', 'data', 'updates', 'about')) {
            Shot "settings-$tab" '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'settings', '--settings-tab', $tab))
          }
          Shot 'settings-appearance-dark' '1024x681' 45 ($mock + @('--appearance', 'dark', '--open', 'settings', '--settings-tab', 'appearance'))
          foreach ($p in $script:running) { if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } }
          Get-ChildItem shots -Filter *.png | ForEach-Object { Write-Host "shot $($_.BaseName)" }
          Get-ChildItem $env:RUNNER_TEMP -Filter 'profile-*' -Directory | ForEach-Object {
            $log = Join-Path $_.FullName 'simpl.log'
            if (Test-Path $log) { Copy-Item $log "shots/$($_.Name).log"; Write-Host "--- $($_.Name)"; Get-Content $log -Tail 25 }
          }
          Get-ChildItem shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-fluent-shots
          path: shots
      - name: Zip
        shell: bash
        run: (cd dist && 7z a -tzip -mx=7 ../Simpl-Windows-x64.zip Simpl >/dev/null) && ls -la Simpl-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Simpl-Windows-x64
          path: Simpl-Windows-x64.zip

  publish:
    name: Publish the preview
    needs: [app]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.preview) || contains(github.event.head_commit.message, '[preview]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Simpl-Windows-x64
          path: zips
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(printf '%03d' "${{ github.run_number }}")
          tag="windows-fluent-v$n"
          gh release create "$tag" zips/*.zip --target "${{ github.sha }}" --prerelease \
            --title "Simpl for Windows — Windows 11 look, preview (v$n)" \
            --notes-file windows/SimplFluent/RELEASE_NOTES.md
          echo "https://github.com/${{ github.repository }}/releases/tag/$tag"
