          # run's) — and the 3D views' framing as their logs say it
          foreach ($name in @($script:mine | Where-Object { $_ -match '^wide-(dna|cell|biomol|atom|molecule)-(1366|1024|780)(-dark)?$' })) {
            $want = @{ '1366' = 1318; '1024' = 976; '780' = 748 }[($name -split '-')[2]]
            $wideLog = "shots/profile-$name.log"
            $said = @(Select-String -Path $wideLog -Pattern 'large popup tool:\S+ opens at (\d+)\D+(\d+)' -ErrorAction SilentlyContinue | ForEach-Object { [int]$_.Matches[0].Groups[1].Value }) | Select-Object -First 1
            if (-not $said -or [Math]::Abs($said - $want) -gt 2) { Write-Host "::error::${name}: the tool's popup opened $said wide, not $want (the window's width less its margins, over the pane) ($wideLog)"; exit 1 }
            $framed = @(Select-String -Path $wideLog -Pattern '(3d view|element view|molecule view) .+$' -ErrorAction SilentlyContinue | ForEach-Object { $_.Matches[0].Value }) | Select-Object -Last 1
            Write-Host "${name}: the popup $said wide; $framed"
            # (a biology view's model itself filling 70% of its view or more where it meets the view first — not only the
            #  model with its labels round it: the owner's complaint was a model small in the middle of its labels)
            if ($name -match '^wide-(dna|cell|biomol)-') {
              $own = @(Select-String -Path $wideLog -Pattern '3d view \S+: the model \S+, (\d+)% of the view' -ErrorAction SilentlyContinue | ForEach-Object { [int]$_.Matches[0].Groups[1].Value }) | Select-Object -Last 1
              if (-not $own -or $own -lt 70) { Write-Host "::error::${name}: the 3D model itself fills $own% of its view, under 70% ($wideLog)"; exit 1 }
            }
          }
          foreach ($kept in @(@('wide-dna-least', 'tool:dna', 480, 340), @('wide-cell-kept-small', 'tool:cell', 748, 603))) {
            if ($script:mine -notcontains $kept[0]) { continue }
            $keptLog = "shots/profile-$($kept[0]).log"
            $m = @(Select-String -Path $keptLog -Pattern "large popup $($kept[1]) opens at (\d+)\D+(\d+) \(the student's\)" -ErrorAction SilentlyContinue) | Select-Object -First 1
            if (-not $m -or [Math]::Abs([int]$m.Matches[0].Groups[1].Value - $kept[2]) -gt 2 -or [Math]::Abs([int]$m.Matches[0].Groups[2].Value - $kept[3]) -gt 2) { Write-Host "::error::$($kept[0]): the popup did not open at $($kept[2]) by $($kept[3]), the student's size held to the room ($($m.Line)) ($keptLog)"; exit 1 }
            Write-Host "$($kept[0]): $($m.Matches[0].Value)"
          }
          # Knewton Alta over a tool's popup, a step down and along: its right and bottom edges no further out than the
          # first's (its own edges, which size it, inside the window)
          if ($script:mine -contains 'wide-two') {
            $opens = @(Select-String -Path 'shots/profile-wide-two.log' -Pattern 'large popup \S+ opens at (\d+)\D+(\d+) \(.+?\) at (-?\d+),(-?\d+)' -ErrorAction SilentlyContinue | ForEach-Object { , @([int]$_.Matches[0].Groups[1].Value, [int]$_.Matches[0].Groups[2].Value, [int]$_.Matches[0].Groups[3].Value, [int]$_.Matches[0].Groups[4].Value) })
            if ($opens.Count -lt 2) { Write-Host "::error::wide-two: two large popups did not open (shots/profile-wide-two.log)"; exit 1 }
            $a = $opens[0]; $b = $opens[1]
            if ($b[2] + $b[0] -gt $a[2] + $a[0] + 1 -or $b[3] + $b[1] -gt $a[3] + $a[1] + 1 -or $b[2] -le $a[2]) { Write-Host "::error::wide-two: the second popup ($($b -join ',')) is not a step along inside the first's edges ($($a -join ','))"; exit 1 }
            Write-Host "wide-two: $($a[0])x$($a[1]) at $($a[2]),$($a[3]); then $($b[0])x$($b[1]) at $($b[2]),$($b[3])"
          }
          # a popup moved by its heading (sizing off while it moves, on again after), then sized by its edge
          if ($script:mine -contains 'popup-move') {
            $moveSaid = if (Test-Path shots/popup-move.log) { Get-Content shots/popup-move.log -Raw } else { '' }
            $mv = [regex]::Match($moveSaid, 'popup move: moved by (-?\d+),(-?\d+) to \S+; sizable: (\w+)')
            if (-not $mv.Success -or [Math]::Abs([int]$mv.Groups[1].Value + 120) -gt 8 -or [Math]::Abs([int]$mv.Groups[2].Value - 40) -gt 8 -or $mv.Groups[3].Value -ne 'CanResize') { Write-Host "::error::popup-move: the popup was not moved 120 left and 40 down by its heading, sizable after ($($mv.Value)) (shots/popup-move.log)"; Get-Content shots/popup-move.log -Tail 30 -ErrorAction SilentlyContinue; exit 1 }
            $md = [regex]::Match($moveSaid, 'popup drag: tool:dna is (\d+)\D+(\d+), kept as (\d+),(\d+)')
            if (-not $md.Success -or [Math]::Abs([int]$md.Groups[3].Value - 1118) -gt 40 -or [Math]::Abs([int]$md.Groups[4].Value - 682) -gt 2) { Write-Host "::error::popup-move: moved, the popup was not then sized by its edge to about 1118 by 682 ($($md.Value)) (shots/popup-move.log)"; exit 1 }
            Write-Host "popup-move: $($mv.Value); then $($md.Value)"
          }
          # a large popup sized by its right edge as a student sizes it, then Simpl opened again: its popup opens at the
          # size kept (Shell/FloatPopup.cs: "popup drag: tool:dna is …, kept as …", "large popup tool:dna opens at … (the
          # student's)")
          if ($script:mine -contains 'popup-kept') {
            $dragSaid = if (Test-Path shots/popup-drag.log) { Get-Content shots/popup-drag.log -Raw } else { '' }
            $m = [regex]::Match($dragSaid, 'popup drag: tool:dna is (\d+)\D+(\d+), kept as (\d+),(\d+)')
            if (-not $m.Success) { Write-Host "::error::popup-drag: the popup was not sized by its edge, or no size was kept (shots/popup-drag.log)"; Get-Content shots/popup-drag.log -Tail 30 -ErrorAction SilentlyContinue; exit 1 }
            $kw = [int]$m.Groups[3].Value; $kh = [int]$m.Groups[4].Value
            if ($kw -lt 900 -or $kw -gt 1100 -or [Math]::Abs($kh - 682) -gt 2) { Write-Host "::error::popup-drag: the size kept, $kw by $kh, is not the popup's 1318 by 682 made 300 narrower by its edge (shots/popup-drag.log)"; exit 1 }
            $keptSaid = if (Test-Path shots/popup-kept.log) { Get-Content shots/popup-kept.log -Raw } else { '' }
            $second = $keptSaid.Substring([Math]::Min($keptSaid.Length, $dragSaid.Length))
            if ($second -notmatch "large popup tool:dna opens at $kw\D+$kh \(the student's\)") { Write-Host "::error::popup-kept: the tool's popup did not open at the size kept, $kw by $kh (shots/popup-kept.log)"; exit 1 }
            Write-Host "popup-drag: sized by its edge to $kw by $kh and kept; popup-kept: opened at it"
          }
          # the live check (Shell/LiveCheck.cs): before the mock changed, a check found nothing new; after, one found the
          # change and showed only that part — a counter's number and a row of Coming up drawn again (done), a row added
          # (task), one course's card (grade) — and nothing built the page again from then on; then a check found nothing
          # new again. Each check's line, with the reads it cost, is printed
          foreach ($live in @(@('live-dashboard-done', @('counter:', 'list(~1)')), @('live-dashboard-task', @('list(+1')), @('live-dashboard-grade', @('card:')))) {
            $name = $live[0]
            if ($script:mine -notcontains $name) { continue }
            $phase = 'before'; $quietBefore = 0; $quietAfter = 0; $built = 0; $updates = @()
            foreach ($l in @(Get-Content "shots/profile-$name.log" -ErrorAction SilentlyContinue)) {
              if ($l -match ' picture at ') { break }
              if ($l -match 'live: ') { Write-Host "${name}: $($l -replace '^\S+ ', '')" }
              if ($l -match 'live: the mock school changed: \w+ \(ok') { $phase = 'changed'; continue }
              if ($l -match 'live: dashboard unchanged') { if ($phase -eq 'before') { $quietBefore++ } elseif ($phase -eq 'updated') { $quietAfter++ }; continue }
              if ($l -match 'live: dashboard updated (.+) \S \S+ reads$') { if ($phase -ne 'before') { $updates += $Matches[1]; $phase = 'updated' }; continue }
              if ($l -match 'live: dashboard built' -and $phase -ne 'before') { $built++ }
            }
            $bad = @()
            if ($quietBefore -lt 1) { $bad += 'no check found nothing new before the mock changed' }
            if ($phase -eq 'before') { $bad += 'the mock school was not changed' }
            if ($updates.Count -eq 0) { $bad += 'no check found the change' }
            foreach ($want in $live[1]) { if (-not (@($updates | Where-Object { $_.Contains($want) }).Count)) { $bad += "no update showed $want (it showed: $($updates -join ' | '))" } }
            if ($built -gt 0) { $bad += "the page was built again $built times after the change" }
            if ($quietAfter -lt 1) { $bad += 'no check found nothing new after the update' }
            if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host "::error::${name}: $_ (shots/profile-$name.log)" }; exit 1 }
            Write-Host "${name}: $quietBefore checks found nothing new, then $($updates -join ' | '), then $quietAfter found nothing new; the page not built again"
          }
          # a course's page checked every ten intervals, not every one: with --live-every 3, once or twice in the minute
          if ($script:mine -contains 'live-course') {
            $checks = @(Select-String -Path 'shots/profile-live-course.log' -Pattern 'live: contexthome (unchanged|updated|could not)' -ErrorAction SilentlyContinue)
            $checks | ForEach-Object { Write-Host "live-course: $($_.Line -replace '^\S+ ', '')" }
            if ($checks.Count -lt 1 -or $checks.Count -gt 2) { Write-Host "::error::live-course: a course's home was checked $($checks.Count) times in a minute with --live-every 3, not once or twice (shots/profile-live-course.log)"; exit 1 }
          }
          if ($script:mine -match 'hand-in-phone-') { Write-Host "Send from Phone: $(Get-Content shots/phone-test.txt -Raw -ErrorAction SilentlyContinue)" }
          # setup's save, as a student's Start using Simpl: it must save, and nothing after it may fail (a failure is
          # printed whole, with the bridge's own error, so its cause can be read here)
          if ($script:mine -contains 'setup-saved') {
            $saved = 'shots/profile-setup-saved.log'
            if (-not (Test-Path $saved)) { Write-Error "setup-saved made no log"; exit 1 }
            $bad = Select-String -Path $saved -Pattern 'setup save:|setup saved, then|bridge ' -SimpleMatch:$false
            if ($bad) { Write-Host "--- setup-saved: what failed"; Get-Content $saved; Write-Error "setup's save failed or something after it did (shots/profile-setup-saved.log)"; exit 1 }
          }
          # the biology toolkit's self-check, as tools-biology ran it in the app (--bio-check): a summary, every line OK
          if ($script:mine -contains 'tools-biology') {
            $bio = 'shots/profile-tools-biology.log'
            $sum = if (Test-Path $bio) { Select-String -Path $bio -Pattern 'bio-check summary (\d+)/(\d+) (OK|FAIL)' | Select-Object -Last 1 } else { $null }
            if (-not $sum) { Write-Error "tools-biology's log has no bio-check summary (shots/profile-tools-biology.log)"; exit 1 }
            Write-Host "biology self-check: $($sum.Matches[0].Value)"
            if ($sum.Matches[0].Groups[3].Value -ne 'OK') { Select-String -Path $bio -Pattern 'bio-check \S+ \S+ FAIL' | ForEach-Object { Write-Host "::error::$($_.Line)" }; exit 1 }
          }
          # Hardy–Weinberg's simulation drawn before its pictures were taken: the last thing its chart said it showed before
          # "picture at" in each one's log (the Simulate page writes "popgen simulate: shows …" when that changes) must be
          # the finished run, not the empty chart of generation 0 waiting for one
          foreach ($hw in @(@('bio-popgen-lethal', '1 population to generation 50 of 50'), @('bio-popgen-simulate', '5 populations to generation 100 of 100'))) {
            if ($script:mine -notcontains $hw[0]) { continue }
            $hwLog = "shots/profile-$($hw[0]).log"
            $shown = $null
            foreach ($l in @(if (Test-Path $hwLog) { Get-Content $hwLog })) {
              if ($l -match ' picture at ') { break }
              if ($l -match 'popgen simulate: shows (.+)$') { $shown = $Matches[1] }
            }
            if ($shown -ne $hw[1]) { Write-Host "::error::$($hw[0]): its chart showed '$shown' when it was pictured, not '$($hw[1])' ($hwLog)"; exit 1 }
            Write-Host "$($hw[0]): its chart showed $shown"
          }
          Get-ChildItem shots
      # (what Simpl keeps is encrypted — windows/SimplFluent/Support/Vault.cs — checked in this part's profiles as the
      #  pictures left them, sign-in-stay's among them: prefs.json, storage.json, flashcards.json, login.bin and every
      #  answer kept must begin with the vault's SIMPLENC, vault.key with SIMPLVK1; and no file in them, WebView2's
      #  included, may hold the mock's sign-in in plain text — scripts/dev/mock-canvas.mjs lets in any login with the
      #  password "demo", and the shots type student, slow and code. The vault's own lines say whether this runner's TPM
      #  took the key.)
      - name: Encrypted at rest
        if: ${{ matrix.shard == 1 }}
        shell: pwsh
        run: |
          $began = Get-Date
          # (the web views' helper processes let go of their files a moment after Simpl quits)
          for ($i = 0; $i -lt 20 -and (Get-Process msedgewebview2 -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Milliseconds 250 }
          $latin1 = [System.Text.Encoding]::Latin1
          $utf16 = [System.Text.Encoding]::Unicode
          # the mock's sign-in as the shots type it (--sign-in user:demo), as it would be kept (JSON), and as its form
          # posts it — in UTF-8 and in UTF-16 (Windows' and Chromium's own strings)
          $plain = @('student:demo', 'slow:demo', 'code:demo', '"pass":"demo"', '"pass": "demo"', '"password":"demo"', '"password": "demo"', 'password]=demo', 'password%5D=demo')
          $needles = @($plain | ForEach-Object { @{ Name = $_; Text = $_ }; @{ Name = "$_ (UTF-16)"; Text = $latin1.GetString($utf16.GetBytes($_)) } })
          $mustSeal = @('prefs.json', 'storage.json', 'flashcards.json', 'login.bin')
          $bad = [System.Collections.Generic.List[string]]::new()
          $seen = @{}; $files = 0; $bytes = 0L; $held = 0
          $profiles = @(Get-ChildItem $env:RUNNER_TEMP -Filter 'profile-*' -Directory)
          foreach ($prof in $profiles) {
            foreach ($f in Get-ChildItem $prof.FullName -Recurse -File -Force -ErrorAction SilentlyContinue) {
              $rel = $f.FullName.Substring($prof.FullName.Length + 1)
              try { $data = [System.IO.File]::ReadAllBytes($f.FullName) } catch { $held++; continue }
              $files++; $bytes += $data.Length
              $kind = if ($mustSeal -contains $rel) { $rel } elseif ($rel -like 'Answers\*') { 'answers' } elseif ($rel -eq 'vault.key') { 'vault.key' } else { $null }
              if ($kind) {
                $seen[$kind] = 1 + [int]$seen[$kind]
                $want = if ($kind -eq 'vault.key') { 'SIMPLVK1' } else { 'SIMPLENC' }
                if ($latin1.GetString($data, 0, [Math]::Min(8, $data.Length)) -cne $want) { $bad.Add("$($prof.Name)\$rel does not begin with $want") }
              }
              $text = $latin1.GetString($data)
              foreach ($n in $needles) {
                if ($text.IndexOf($n.Text, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) { $bad.Add("$($prof.Name)\$rel holds the mock's sign-in in plain text: $($n.Name)") }
              }
              # (simpl.log, the one plain file of Simpl's own: not the password, nor a username, even on their own)
              if ($rel -eq 'simpl.log' -and $text -cmatch '(?<![\w-])(demo|student|slow)(?![\w-])') { $bad.Add("$($prof.Name)\simpl.log names the mock's password or a username: $($Matches[0])") }
            }
          }
          $took = [Math]::Round(((Get-Date) - $began).TotalSeconds, 1)
          Write-Host "checked $($profiles.Count) profiles: $files files, $([Math]::Round($bytes / 1MB)) MB, in $took s ($held still held by a web view, left out)"
          foreach ($k in @('prefs.json', 'storage.json', 'flashcards.json', 'login.bin', 'answers', 'vault.key')) { Write-Host "  $k sealed: $([int]$seen[$k])" }
          # (each start's vault, as its log says: made or opened, and whether the TPM took its key)
          $profiles | ForEach-Object { $l = Join-Path $_.FullName 'simpl.log'; if (Test-Path $l) { Select-String -Path $l -Pattern ' vault: ' | ForEach-Object { ($_.Line -replace '^\S+ ', '') -replace '\d+ ms', 'n ms' } } } | Sort-Object -Unique | ForEach-Object { Write-Host "  $_" }
          if ([int]$seen['storage.json'] -eq 0 -or [int]$seen['answers'] -eq 0 -or [int]$seen['vault.key'] -eq 0) { $bad.Add("nothing to check: no storage.json, kept answer or vault.key in this part's profiles") }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "encrypted at rest: every store sealed, and the mock's sign-in in plain text nowhere"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-fluent-part-${{ matrix.shard }}
          path: shots

  # (how quickly Simpl starts and moves about, and how much memory it and its web view take, walked against the mock —
  #  Support/PerfWalk.cs: a fresh profile, cold, then the same one again, warm — and compared with the last green
  #  run's: with its own numbers, and with its build walked again here, on this same runner, between this one's walks
  #  (one runner's processor and memory move the numbers more than most changes do). For now also once under
  #  dotnet-trace, where the window's time goes. It only reports: a slower number never fails the run, and nothing
  #  waits for it but the pictures' merge)
  perf:
    name: Performance walk
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: read
      actions: read # (the last green run's walk, to compare with)
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/dev
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: The build
        shell: bash
        run: (cd dist && 7z x -y Simpl-Windows-x64.zip >/dev/null) && test -f dist/Simpl/Simpl.exe && ls dist
      - name: Mock Canvas
        shell: bash
        run: |
          node scripts/dev/mock-canvas.mjs 8800 8801 > mock.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8800/ && break; sleep 0.5; done
          curl -s -o /dev/null -w "mock %{http_code}\n" http://localhost:8800/
      - name: The run to compare with, its walk and its build
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # (the newest green push run of this branch that kept a walk — or the one the commit names, "[perf-base <run
          #  id>]": its numbers are the "before", and its build, kept 30 days, is walked again here)
          mkdir -p prev base
          named=$(printf '%s' "$MESSAGE" | sed -n 's/.*\[perf-base \([0-9][0-9]*\)\].*/\1/p' | head -1)
          if [ -n "$named" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$named" --jq '"\(.id) \(.run_number) \(.head_sha)"' > runs.txt 2>/dev/null || true
          else
            gh run list -R "$GITHUB_REPOSITORY" --workflow windows-fluent.yml --branch "$BRANCH" --event push --status success -L 5 \
              --json databaseId,number,headSha --jq '.[] | "\(.databaseId) \(.number) \(.headSha)"' > runs.txt 2>/dev/null || true
          fi
          while read -r id number sha; do
            [ -n "$id" ] || continue
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n windows-fluent-perf -D prev >/dev/null 2>&1 && [ -f prev/perf-warm.json ]; then
              echo "run #$number (${sha:0:7})" > prev/from.txt
              if gh run download "$id" -R "$GITHUB_REPOSITORY" -n release -D base >/dev/null 2>&1 && (cd base && 7z x -y Simpl-Windows-x64.zip >/dev/null) && [ -f base/Simpl/Simpl.exe ]; then
                echo "its build, to walk here too: base/Simpl"
              else
                echo "its build is no longer kept: compared with its numbers only"
              fi
              break
            fi
            rm -rf prev && mkdir -p prev
          done < runs.txt
          if [ -f prev/from.txt ]; then echo "comparing with $(cat prev/from.txt)"; else echo "no earlier walk to compare with"; fi
      - name: Walk (the build compared with, then this one; cold, then warm)
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; Write-Host "display 1920x1080" } catch { Write-Host "display left as it is: $_" }
          # (Windows Server leaves its animation effects off; a student's PC has them on, and Simpl's motion follows them)
          try {
            Add-Type -Namespace SimplPerf -Name Spi -MemberDefinition '[DllImport("user32.dll")] public static extern bool SystemParametersInfo(uint action, uint param, IntPtr value, uint flags);'
            Write-Host "animation effects on: $([SimplPerf.Spi]::SystemParametersInfo(0x1043, 0, [IntPtr]1, 3))"
          } catch { Write-Host "animation effects left as they are: $_" }
          New-Item -ItemType Directory -Force shots | Out-Null
          $prof = Join-Path $env:RUNNER_TEMP 'profile-perf'
          $baseProf = Join-Path $env:RUNNER_TEMP 'profile-perf-base'
          $mock = @('--base-url', 'http://localhost:8800', '--demo', '--appearance', 'light')
          $fence = '```'
          # (each: its name, the build, its profile, what it adds. One profile for each build — its cold walk fills it —
          #  and no --window-size, so where the window is, and the prefs that keep it, are walked too. The build
          #  compared with goes first each time, so neither finds the runner warmer)
          $walks = @()
          $hasBase = Test-Path base/Simpl/Simpl.exe
          if ($hasBase) { $walks += ,@('base-cold', 'base/Simpl/Simpl.exe', $baseProf, @()) }
          $walks += ,@('cold', 'dist/Simpl/Simpl.exe', $prof, @())
          if ($hasBase) { $walks += ,@('base-warm', 'base/Simpl/Simpl.exe', $baseProf, @()) }
          $walks += ,@('warm', 'dist/Simpl/Simpl.exe', $prof, @())
          # (each build opened once first and left to quit, with a profile of no use after: the runner's disk has both
          #  builds, .NET and WebView2 read once, so the first walk is not the only one to pay for reading them)
          foreach ($exe in @('base/Simpl/Simpl.exe', 'dist/Simpl/Simpl.exe')) {
            if (-not (Test-Path $exe)) { continue }
            $warmup = Join-Path $env:RUNNER_TEMP ('profile-warmup-' + [guid]::NewGuid())
            $p = Start-Process -FilePath $exe -ArgumentList ($mock + @('--profile', $warmup, '--perf-walk', (Join-Path $env:RUNNER_TEMP 'warmup'), '--perf-timeout', '8')) -PassThru
            if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }
          foreach ($w in $walks) {
            $run = $w[0]
            $argList = $mock + @('--profile', $w[2], '--perf-walk', "$PWD/shots", '--perf-name', $run, '--perf-course', '101', '--perf-assignment', '1001', '--perf-timeout', '240') + $w[3]
            $began = Get-Date
            $p = Start-Process -FilePath $w[1] -ArgumentList $argList -PassThru
            if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Write-Host "::warning::the $run walk was still going after five minutes: stopped" }
            Write-Host "$run walk: $([math]::Round(((Get-Date) - $began).TotalSeconds)) s"
            $txt = "shots/perf-$run.txt"
            if (Test-Path $txt) {
              Get-Content $txt | Write-Host
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Performance walk: $run", '', $fence, (Get-Content $txt -Raw), $fence, ''
            } else { Write-Host "::warning::the $run walk wrote no perf-$run.txt" }
            Start-Sleep -Seconds 3   # (its web view's helper processes end a moment after it)
          }
          $log = Join-Path $prof 'simpl.log'
          if (Test-Path $log) { Copy-Item $log shots/profile-perf.log }
          $log = Join-Path $baseProf 'simpl.log'
          if (Test-Path $log) { Copy-Item $log shots/profile-perf-base.log }
          Get-ChildItem shots
      - name: Where the window's time goes (the warm walk under dotnet-trace)
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-trace | Out-Host
          $tool = Join-Path $env:USERPROFILE '.dotnet\tools\dotnet-trace.exe'
          New-Item -ItemType Directory -Force trace | Out-Null
          $prof = Join-Path $env:RUNNER_TEMP 'profile-perf'
          $argList = @('--base-url', 'http://localhost:8800', '--demo', '--appearance', 'light', '--profile', $prof, '--perf-walk', "$PWD/trace", '--perf-name', 'trace',
            '--perf-course', '101', '--perf-assignment', '1001', '--perf-timeout', '240', '--perf-minimized', '0')
          $p = Start-Process -FilePath dist/Simpl/Simpl.exe -ArgumentList $argList -PassThru
          Start-Sleep -Milliseconds 300
          # (the sampler and the runtime's own events, named outright: dotnet-trace 10 has no cpu-sampling profile)
          $providers = 'Microsoft-DotNETCore-SampleProfiler,Microsoft-Windows-DotNETRuntime:0x00000014C14FCCBD:4'
          $t = Start-Process -FilePath $tool -ArgumentList @('collect', '--process-id', "$($p.Id)", '--providers', $providers, '--duration', '00:00:03:00', '-o', "$PWD/trace/simpl.nettrace") -PassThru -NoNewWindow
          if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not $t.WaitForExit(120000)) { Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue; Write-Host "::warning::dotnet-trace did not end" }
          if (Test-Path trace/simpl.nettrace) {
            & $tool convert "$PWD/trace/simpl.nettrace" --format Speedscope -o "$PWD/trace/simpl.speedscope.json" | Out-Host
          }
          Get-ChildItem trace | Out-Host
      - name: Against the last green run, and each choice against the warm walk
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          node - "$(cat prev/from.txt 2>/dev/null)" <<'EOF'
          // (each walk against the same walk of the last green run: every point of the start, every step's ui and data,
          //  all the calls' time, and memory — Simpl's and its web view's processes together, then each — at each moment
          //  it was read; then each choice tried against this run's warm walk)
          const fs = require('fs');
          const from = process.argv[2] || '';
          const read = f => { try { return JSON.parse(fs.readFileSync(f, 'utf8')); } catch { return null; } };
          const n = v => v == null ? '—' : String(Math.round(v));
          const change = (b, a) => b == null || a == null || b <= 0 ? '—' : `${a >= b ? '+' : '-'}${Math.abs(Math.round((a - b) / b * 100))}%`;
          const memRows = (b, a) => {
            const rows = [];
            for (const when of ['settled', 'walked', 'idle', 'minimized']) {
              const x = b?.memory?.[when], y = a?.memory?.[when];
              if (!x && !y) continue;
              rows.push([`memory ${when}, private`, x?.total?.private, y?.total?.private]);
              rows.push([`memory ${when}, working set`, x?.total?.workingSet, y?.total?.workingSet]);
              rows.push(['  Simpl private', x?.simpl?.private, y?.simpl?.private]);
              rows.push(['  Simpl working set', x?.simpl?.workingSet, y?.simpl?.workingSet]);
              rows.push(['  WebView2 private', x?.webView?.private, y?.webView?.private]);
              rows.push(['  WebView2 working set', x?.webView?.workingSet, y?.webView?.workingSet]);
            }
            return rows;
          };
          const table = (title, before, after) => {
            const rows = Object.entries(after.start || {}).map(([k, v]) => [`start ${k}`, before.start?.[k], v]);
            for (const s of after.steps || []) {
              const b = (before.steps || []).find(x => x.name === s.name) || {};
              rows.push([`${s.name} ui`, b.ui, s.ui]);
              if (s.data != null || b.data != null) rows.push([`${s.name} data`, b.data, s.data]);
            }
            const calls = o => Object.values(o.calls || {}).reduce((t, c) => t + (c.total || 0), 0);
            rows.push(['calls, all ms', calls(before), calls(after)]);
            rows.push(...memRows(before, after));
            const unfinished = [before.complete === false && 'that walk did not finish', after.complete === false && 'this one did not finish'].filter(Boolean);
            const out = [`${title}${unfinished.length ? ` (${unfinished.join('; ')})` : ''}`];
            out.push(`${''.padEnd(30)} ${'before'.padStart(8)} ${'after'.padStart(8)} ${'change'.padStart(8)}`);
            for (const [name, b, a] of rows) out.push(`${name.padEnd(30)} ${n(b).padStart(8)} ${n(a).padStart(8)} ${change(b, a).padStart(8)}`);
            out.push('');
            return out;
          };
          const out = [];
          // (first against that run's build walked here, on this runner; then against the numbers it had on its own)
          for (const run of ['cold', 'warm']) {
            const before = read(`shots/perf-base-${run}.json`), after = read(`shots/perf-${run}.json`);
            if (before && after) out.push(...table(`${run}, ms and MB, against ${from}'s build walked on this runner (${after.env?.cpu || ''})`, before, after));
          }
          for (const run of ['cold', 'warm']) {
            const before = from ? read(`prev/perf-${run}.json`) : null, after = read(`shots/perf-${run}.json`);
            if (!before || !after) { out.push(`${run}: nothing to compare (${after ? 'no earlier walk' : 'no walk this time'})`, ''); continue; }
            out.push(...table(`${run}, ms and MB, against ${from} as it ran (${before.env?.cpu || ''})`, before, after));
          }
          console.log(out.join('\n'));
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Performance walk, against ${from || 'nothing earlier'}\n\n\`\`\`\n${out.join('\n')}\n\`\`\`\n`);
          EOF
      # (the walk alone, for the next run to compare with; and with the pictures, its profile's log too; the trace apart)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-fluent-perf
          path: shots/perf-*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-fluent-part-perf
          path: shots
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: windows-fluent-trace
          path: trace
          retention-days: 7

  installer:
    name: Installer, made and tried
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write # (Azure signed in to, to sign Setup and its uninstaller, when the repository can)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: The build
        shell: bash
        run: (cd dist && 7z x -y Simpl-Windows-x64.zip >/dev/null) && test -f dist/Simpl/Simpl.exe && ls dist
      # signed, once the repository has an Artifact Signing account (windows/SimplFluent/README.md, Signing: its six
      # Actions variables): Azure signed in to without a secret (OIDC), then signtool and Artifact Signing's dlib
      - name: Azure, to sign
        if: ${{ vars.SIGNING_ACCOUNT != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Signing tools
        if: ${{ vars.SIGNING_ACCOUNT != '' }}
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sign'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $nuget = (Get-Command nuget.exe -ErrorAction SilentlyContinue).Source
          if (-not $nuget) { $nuget = Join-Path $dir 'nuget.exe'; Invoke-WebRequest https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile $nuget }
          & $nuget install Microsoft.Windows.SDK.BuildTools -x -OutputDirectory $dir -NonInteractive | Out-Null
          & $nuget install Microsoft.ArtifactSigning.Client -x -OutputDirectory $dir -NonInteractive | Out-Null
          $signtool = Get-ChildItem $dir -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          $dlib = Get-ChildItem $dir -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $signtool -or -not $dlib) { Write-Host "::error::signtool or Artifact Signing's dlib not found"; exit 1 }
          # (signed in as azure/login left it: the Azure CLI's sign-in, the others not tried)
          $metadata = Join-Path $dir 'metadata.json'
          @{
            Endpoint = $env:SIGNING_ENDPOINT; CodeSigningAccountName = $env:SIGNING_ACCOUNT; CertificateProfileName = $env:SIGNING_PROFILE
            CorrelationId = "${{ github.run_id }}"
            ExcludeCredentials = @('ManagedIdentityCredential', 'WorkloadIdentityCredential', 'SharedTokenCacheCredential',
              'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
          } | ConvertTo-Json | Set-Content $metadata
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "SIGN_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
          "SIGN_METADATA=$metadata" >> $env:GITHUB_ENV
          Write-Host "signtool: $($signtool.FullName)"; Write-Host "dlib: $($dlib.FullName)"
      - name: Installer (Simpl-Setup.exe)
        shell: pwsh
        run: |
          # Inno Setup's compiler: on GitHub's Windows image when it has it, else from Chocolatey (Inno Setup 7, if that
          # is what comes, reads the script the same)
          function Find-Iscc {
            $onPath = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($onPath) { return $onPath.Source }
            foreach ($root in @(${env:ProgramFiles(x86)}, $env:ProgramFiles, (Join-Path $env:LOCALAPPDATA 'Programs'))) {
              if (-not $root) { continue }
              $found = Get-ChildItem -Path $root -Filter 'Inno Setup*' -Directory -ErrorAction SilentlyContinue |
                ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } | Where-Object { Test-Path $_ } | Sort-Object -Descending | Select-Object -First 1
              if ($found) { return $found }
            }
            return $null
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "Inno Setup is not on this image: installing it"
            choco install innosetup -y --no-progress | Out-Host
            $iscc = Find-Iscc
          }
          if (-not $iscc) { Write-Host "::error::Inno Setup's compiler (ISCC.exe) was not found, and could not be installed"; exit 1 }
          Write-Host "ISCC: $iscc"
          # the version: the build's own, as About shows it ("0.2.0 (v012)"), and as Windows numbers it (0.2.0.12)
          $display = (Get-Item dist/Simpl/Simpl.dll).VersionInfo.ProductVersion
          $number = "$display".Split(' ')[0]
          if ($number -notmatch '^\d+\.\d+\.\d+$') { $number = '0.0.0' }
          $version = "$number.${{ github.run_number }}"
          if (-not $display) { $display = $version }
          # (signed, when it can be: Inno Setup signs Setup and its uninstaller with this — $q a quote, $f the file)
          $sign = @()
          if ($env:SIGNTOOL) {
            $sign = @('/DSign', ('/Ssimpl=$q' + $env:SIGNTOOL + '$q sign /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $q' + $env:SIGN_DLIB + '$q /dmdf $q' + $env:SIGN_METADATA + '$q $f'))
          }
          & $iscc @sign "/DAppVersion=$version" "/DAppDisplayVersion=$display" "/DSourceDir=$PWD\dist\Simpl" "/DOutputDir=$PWD\dist" windows\SimplFluent\Installer\Simpl.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::ISCC failed ($LASTEXITCODE)"; exit 1 }
          if (-not (Test-Path dist/Simpl-Setup.exe)) { Write-Host "::error::ISCC made no dist/Simpl-Setup.exe"; exit 1 }
          if ($env:SIGNTOOL) {
            $sig = Get-AuthenticodeSignature dist/Simpl-Setup.exe
            if ($sig.Status -ne 'Valid') { Write-Host "::error::Simpl-Setup.exe is not signed ($($sig.Status))"; exit 1 }
            Write-Host "Simpl-Setup.exe signed by $($sig.SignerCertificate.Subject)"
          }
          $size = [math]::Round((Get-Item dist/Simpl-Setup.exe).Length / 1MB, 1)
          Write-Host "Simpl-Setup.exe, version $version ($display): $size MB"
      - uses: actions/upload-artifact@v4
        with:
          name: release-setup
          path: dist/Simpl-Setup.exe
          compression-level: 0
          retention-days: 30
      - name: Mock Canvas
        shell: bash
        run: |
          node scripts/dev/mock-canvas.mjs 8800 8801 > mock.log 2>&1 &
          # (a second one that asks for a sign-in first: the sign-in pictures)
          node scripts/dev/mock-canvas.mjs 8802 8803 --login > mock-login.log 2>&1 &
          # (up when it answers — a cold runner's Node may take a few seconds — not after a set time)
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8800/ && curl -s -o /dev/null http://localhost:8802/login/canvas && break; sleep 0.5; done
          curl -s -o /dev/null -w "mock %{http_code}\n" http://localhost:8800/
          curl -s -o /dev/null -w "mock sign-in %{http_code}\n" http://localhost:8802/login/canvas
      - name: Installer, tried (installed, opened, an update by itself, updated over a running Simpl, a failed update, uninstalled, uninstalled from Simpl)
        shell: pwsh
        run: |
          $setupLog = Join-Path $env:RUNNER_TEMP 'installer-setup.log'
          $updateLog = Join-Path $env:RUNNER_TEMP 'installer-update.log'
          $failedLog = Join-Path $env:RUNNER_TEMP 'installer-update-failed.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'installer-uninstall.log'
          $againLog = Join-Path $env:RUNNER_TEMP 'installer-setup-again.log'
          # (the uninstaller Simpl itself starts writes its log here: Support/Uninstall.cs, LogFile)
          $inAppLog = Join-Path ([System.IO.Path]::GetTempPath()) 'Simpl-Uninstall.log'
          New-Item -ItemType Directory -Force shots | Out-Null
          $dir = Join-Path $env:RUNNER_TEMP 'Simpl test install'   # (a space in it, as a user's own folder may have)
          $exe = Join-Path $dir 'Simpl.exe'
          $startMenu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Simpl.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Simpl.lnk'
          # (Settings > Apps' entry: the installer's AppId, as Installer/Simpl.iss and Support/Updates.cs have it)
          $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{B65F70B7-E13E-4CCC-9E1C-0B659660D130}_is1'
          # what Simpl keeps is in its own folder, never the program's: there before, and still there after uninstalling
          # (it is also the folder of the Simpl the update opens again, which is opened with no arguments)
          $data = Join-Path $env:LOCALAPPDATA 'Simpl'
          $kept = Join-Path $data 'kept-by-uninstall.txt'
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content $kept 'what Simpl keeps'
          $prof = Join-Path $env:RUNNER_TEMP 'profile-installed'
          $prof2 = Join-Path $env:RUNNER_TEMP 'profile-running'
          # (every log, kept with the pictures: the installer's runs and each Simpl's)
          $simplLogs = [ordered]@{ 'profile-installed' = $prof; 'profile-running' = $prof2; 'profile-default' = $data }
          function Keep-Logs {
            foreach ($f in @($setupLog, $updateLog, $failedLog, $uninstallLog, $againLog, $inAppLog)) { if (Test-Path $f) { Copy-Item $f shots } }
            foreach ($name in $simplLogs.Keys) {
              $log = Join-Path $simplLogs[$name] 'simpl.log'
              if (Test-Path $log) { Copy-Item $log "shots\$name.log" }
            }
          }
          function Fail($why) {
            Write-Host "::error::$why"
            Keep-Logs
            $all = @($setupLog, $updateLog, $failedLog, $uninstallLog, $againLog, $inAppLog) + @($simplLogs.Values | ForEach-Object { Join-Path $_ 'simpl.log' })
            foreach ($f in $all) { if (Test-Path $f) { Write-Host "--- $f"; Get-Content $f -Tail 60 } }
            Get-Process Simpl -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            exit 1
          }
          # (a log says so; a log that is not there says nothing -- the step runs with $ErrorActionPreference 'stop')
          function Has($file, $pattern) { (Test-Path $file) -and (Select-String -Path $file -Pattern $pattern -Quiet) }
          # (the copies of the installed Simpl.exe running now; one ending as it is looked at is not one)
          function Get-InstalledSimpl { @(Get-Process Simpl -ErrorAction SilentlyContinue | Where-Object { try { $_.Path -eq $exe } catch { $false } }) }
          # (Setup run as Restart to Update runs it, Support/Updates.cs: no /DIR, so where it is installed; -PassThru
          # and WaitForExit, never -Wait, which also waits for what Setup starts, and the Simpl it opens stays open)
          function Start-Update($log) {
            $p = Start-Process -FilePath dist\Simpl-Setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CLOSEAPPLICATIONS', '/LAUNCH', "/LOG=`"$log`"") -PassThru
            $null = $p.Handle   # (held, so its exit code can be read once it has gone)
            return $p
          }

          # 1. installed silently, as Simpl's Restart to Update runs it (without /LAUNCH), into a folder of the test's own
          $p = Start-Process -FilePath dist\Simpl-Setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CLOSEAPPLICATIONS', "/DIR=`"$dir`"", "/LOG=`"$setupLog`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "Simpl-Setup.exe exited with $($p.ExitCode)" }
          if (-not (Test-Path $exe)) { Fail "Simpl.exe is not in $dir" }
          if (-not (Test-Path (Join-Path $dir 'unins000.exe'))) { Fail "there is no uninstaller beside Simpl.exe" }
          if (-not (Test-Path $startMenu)) { Fail "there is no Start menu shortcut ($startMenu)" }
          if (Test-Path $desktop) { Fail "a desktop shortcut was made, though its box starts unticked" }
          $app = Get-ItemProperty -Path $entry -ErrorAction SilentlyContinue
          if (-not $app -or $app.DisplayName -ne 'Simpl') { Fail "Simpl is not in Settings > Apps ($entry)" }
          Write-Host "installed: $($app.DisplayName) $($app.DisplayVersion) in $($app.InstallLocation)"
          # the Start menu shortcut's app id: what makes the window, its taskbar button and the pin one app. Read by the
          # shell, else as the Start menu's own list files Simpl (given a moment to see the new shortcut). Any id that is
          # not SimplCourses.Simpl, or none where a reader ran, fails the build; only neither reader running at all is a
          # warning
          $id = $null; $how = $null; $ran = $false
          try {
            $v = (New-Object -ComObject Shell.Application).NameSpace((Split-Path $startMenu)).ParseName('Simpl.lnk').ExtendedProperty('System.AppUserModel.ID')
            $ran = $true
            if ($v) { $id = "$v"; $how = 'the shell' }
          } catch { Write-Host "::warning::the shell could not read the Start menu shortcut's app id: $_" }
          if (-not $how) {
            $until = (Get-Date).AddSeconds(20)
            do {
              try { $listed = @(Get-StartApps -Name 'Simpl' -ErrorAction Stop | Where-Object { $_.Name -eq 'Simpl' }); $ran = $true }
              catch { Write-Host "::warning::the Start menu's list could not be read: $_"; break }
              if ($listed.Count -gt 0) { $id = "$($listed[0].AppID)"; $how = "the Start menu's list" } else { Start-Sleep -Seconds 1 }
            } while (-not $how -and ((Get-Date) -lt $until))
          }
          if (-not $ran) { Write-Host "::warning::the Start menu shortcut's app id could not be read at all" }
          elseif (-not $how) { Fail "the Start menu shortcut has no app id the shell or the Start menu sees" }
          elseif ($id -ne 'SimplCourses.Simpl') { Fail "the Start menu shortcut's app id reads '$id' ($how), not SimplCourses.Simpl" }
          else { Write-Host "the Start menu shortcut's app id: $id ($how)" }

          # 2. the installed copy opened against the mock: the Dashboard pictured, and Simpl knows it was installed (so
          #    its updates come through the installer)
          $shot = Join-Path $PWD 'shots\installed-dashboard.png'
          $run = Start-Process -FilePath $exe -ArgumentList @('--shot', $shot, '--shot-after', '45', '--profile', $prof, '--window-size', '1024x681', '--base-url', 'http://localhost:8800', '--demo', '--appearance', 'light') -PassThru
          if (-not $run.WaitForExit(150000)) { Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue; Fail "the installed Simpl did not finish its picture" }
          $log = Join-Path $prof 'simpl.log'
          if (Test-Path $log) { Write-Host "--- the installed Simpl's log"; Get-Content $log -Tail 15 }
          if (-not (Test-Path $shot) -or (Get-Item $shot).Length -lt 10000) { Fail "the installed Simpl made no picture of the Dashboard" }
          if (-not (Test-Path $log) -or -not (Select-String -Path $log -Pattern 'starting \(installed\)' -Quiet)) { Fail "the installed Simpl does not know it was installed" }
          Start-Sleep -Seconds 2   # (its web view's helper processes end a moment after it)

          # 2b. an update that comes by itself, as an installed Simpl meets one (--update-test, Support/Updates.cs: the
          #     installer just made, played as the next version): found and downloaded at once, and checked; held while
          #     Simpl opens and while a quiz is open -- its window closed to the notification area meanwhile, as its close
          #     button does; the quiz closed, it notes where it was, quits, and the installer puts the version in place and
          #     opens Simpl again. Opened again on that profile, Simpl comes back where it was: the Grades, out of sight in
          #     the notification area as it was left, its engine running all the same
          $prof3 = Join-Path $env:RUNNER_TEMP 'profile-update'
          $simplLogs['profile-update'] = $prof3
          $ulog = Join-Path $prof3 'simpl.log'
          # (what a log says from a line on: one profile's log holds both of its runs)
          function Says($file, $from, $pattern) { (Test-Path $file) -and (@(Get-Content $file | Select-Object -Skip $from | Select-String -Pattern $pattern).Count -gt 0) }
          $nextSetup = Join-Path $env:RUNNER_TEMP 'Simpl-Setup-next.exe'
          Copy-Item dist\Simpl-Setup.exe $nextSetup
          $updating = Start-Process -FilePath $exe -ArgumentList @('--profile', $prof3, '--base-url', 'http://localhost:8800', '--demo', '--appearance', 'light', '--place', 'grades', '--open', 'quiz:101:9011', '--update-test', $nextSetup, '--update-test-tray', '--update-test-close', '40') -PassThru
          $null = $updating.Handle
          if (-not $updating.WaitForExit(150000)) { Stop-Process -Id $updating.Id -Force -ErrorAction SilentlyContinue; Fail "Simpl, with an update waiting, had not put it in after two and a half minutes" }
          if (Test-Path $ulog) { Write-Host "--- the updating Simpl's log, its updates"; Select-String -Path $ulog -Pattern 'update' | ForEach-Object { $_.Line } }
          # (each step, in its order: found; downloaded and checked; held by the quiz; the quiz closed and the hold let go;
          #  where it was kept; the installer run)
          $at = 0
          foreach ($s in @('update: v\d+ found', "update: v\d+'s installer downloaded and checked", 'update: held \(quiz\)', 'update test: closing what is open over the window',
                           'update: no longer held \(by quiz\)', 'update: where it was: grades, the window hidden', 'update: installing .* and quitting')) {
            $hit = if (Test-Path $ulog) { Select-String -Path $ulog -Pattern $s | Select-Object -First 1 } else { $null }
            if (-not $hit) { Fail "the update played through never logged '$s'" }
            if ($hit.LineNumber -lt $at) { Fail "the update played through logged '$s' out of its order" }
            $at = $hit.LineNumber
          }
          # the installer it ran: the version put in place, and Simpl opened again by /LAUNCH (with no arguments: the
          # default profile)
          $until = (Get-Date).AddSeconds(120)
          while (-not (Get-InstalledSimpl) -and ((Get-Date) -lt $until)) { Start-Sleep -Milliseconds 500 }
          $reopened = @(Get-InstalledSimpl)
          $byItself = Get-ChildItem (Join-Path $prof3 'Update') -Recurse -Filter 'Setup.log' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($byItself) { Copy-Item $byItself.FullName shots\installer-update-by-itself.log }
          if ($reopened.Count -eq 0) { Fail "the update Simpl put in by itself did not open Simpl again" }
          if ($byItself -and (Has $byItself.FullName 'The update did not finish')) { Fail "the update Simpl put in by itself did not finish" }
          Write-Host "an update that came by itself: held by the quiz, put in once it was closed, and Simpl opened again (pid $($reopened[0].Id))"
          $reopened | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3   # (its web view's helper processes end a moment after it)
          $from = @(Get-Content $ulog).Count
          $back = Start-Process -FilePath $exe -ArgumentList @('--profile', $prof3, '--base-url', 'http://localhost:8800', '--demo', '--appearance', 'light') -PassThru
          $null = $back.Handle
          $until = (Get-Date).AddSeconds(90)
          while (-not (Says $ulog $from 'perf: start') -and -not $back.HasExited -and ((Get-Date) -lt $until)) { Start-Sleep -Milliseconds 500 }
          $back.Refresh()
          $shown = if ($back.HasExited) { "none (it exited with $($back.ExitCode))" } else { "$($back.MainWindowHandle)" }
          Stop-Process -Id $back.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (Test-Path $ulog) { Write-Host "--- opened again"; Get-Content $ulog | Select-Object -Skip $from | Select-String -Pattern 'update|perf: start|phase' | ForEach-Object { $_.Line } }
          foreach ($s in @('update: back after updating to v\d+', 'update: opened again in the notification area', 'update: opened again at grades', 'perf: start .*engine ready \d')) {
            if (-not (Says $ulog $from $s)) { Fail "Simpl, opened again after the update, never logged '$s'" }
          }
          if ($shown -ne '0') { Fail "Simpl, opened again after the update, showed a window ($shown), though it was left in the notification area" }
          Write-Host "opened again after the update: at the Grades, in the notification area as it was left, its engine running"

          # 3. an update over a Simpl left open, exactly as Restart to Update runs it: Setup asks Simpl to quit (the quit
          #    event), Simpl takes it and goes, Setup sees it gone, puts the new version in place, and /LAUNCH opens it again
          $open = Start-Process -FilePath $exe -ArgumentList @('--profile', $prof2, '--base-url', 'http://localhost:8800', '--demo', '--appearance', 'light') -PassThru
          $null = $open.Handle
          # (up once its log says its engine has started — "perf: start", as the walk measures it — not after a set wait;
          #  half a minute at most)
          $until = (Get-Date).AddSeconds(30)
          while (-not $open.HasExited -and -not (Has (Join-Path $prof2 'simpl.log') 'perf: start') -and ((Get-Date) -lt $until)) { Start-Sleep -Milliseconds 250 }
          Write-Host "the Simpl to update over: up in $([math]::Round(30 - ($until - (Get-Date)).TotalSeconds, 1)) s"
          if ($open.HasExited) { Fail "the installed Simpl did not stay open (it exited with $($open.ExitCode))" }
          $up = Start-Update $updateLog
          if (-not $up.WaitForExit(180000)) { Fail "the update did not finish in three minutes" }
          if ($up.ExitCode -ne 0) { Fail "the update exited with $($up.ExitCode)" }
          if (-not $open.WaitForExit(10000)) { Fail "the update did not close the Simpl that was open" }
          if (-not (Has (Join-Path $prof2 'simpl.log') 'quit: asked by Simpl')) { Fail "Simpl never got the installer's request to quit" }
          if (-not (Has $updateLog 'asked to quit, it had gone')) { Fail "Setup did not see Simpl quit when asked" }
          $until = (Get-Date).AddSeconds(30)
          while (-not (Get-InstalledSimpl) -and ((Get-Date) -lt $until)) { Start-Sleep -Milliseconds 500 }
          $relaunched = @(Get-InstalledSimpl)
          if ($relaunched.Count -eq 0) { Fail "/LAUNCH did not open Simpl again after the update" }
          Write-Host "updated over an open Simpl: it quit when asked, and the new version was opened again (pid $($relaunched[0].Id))"

          # 4. an update that cannot finish -- a Simpl that will not quit, here a stand-in holding the mutex every Simpl
          #    holds: Setup closes the Simpl that can quit, gives up on the other (/SUPPRESSMSGBOXES answers its "still
          #    open" with Cancel) and, Simpl having quit for the update, opens the copy that was there again
          $before = @($relaunched | ForEach-Object { $_.Id })
          $hold = [System.Threading.Mutex]::new($false, 'SimplCourses.Simpl.App')
          $up = Start-Update $failedLog
          $ended = $up.WaitForExit(180000)
          $hold.Dispose()
          if (-not $ended) { Fail "the update that could not finish did not end" }
          if ($up.ExitCode -eq 0) { Fail "an update that could not close Simpl said it had succeeded" }
          if (-not (Has $failedLog 'it was still open after')) { Fail "Setup did not wait for the Simpl that would not quit" }
          if (-not (Has $failedLog 'opening the copy before it again')) { Fail "Setup did not open the copy before it again" }
          $until = (Get-Date).AddSeconds(30)
          $again = @()
          while ($again.Count -eq 0 -and ((Get-Date) -lt $until)) {
            Start-Sleep -Milliseconds 500
            $again = @(Get-InstalledSimpl | Where-Object { $before -notcontains $_.Id })
          }
          if ($again.Count -eq 0) { Fail "Simpl was left closed after an update that could not finish" }
          if (@(Get-InstalledSimpl | Where-Object { $before -contains $_.Id }).Count -gt 0) { Fail "the Simpl open before the failed update was not asked to quit" }
          Write-Host "an update that could not finish (exit $($up.ExitCode)): the copy that was there opened again (pid $($again[0].Id))"

          # 5. uninstalled silently with Simpl open (the one opened again above): it is asked to quit first; then its
          #    folder, its shortcut and its entry in Settings > Apps gone; what Simpl keeps, kept
          if (@(Get-InstalledSimpl).Count -eq 0) { Fail "no installed Simpl was open to try the uninstaller with" }
          $u = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$uninstallLog`"") -Wait -PassThru
          if ($u.ExitCode -ne 0) { Fail "the uninstaller exited with $($u.ExitCode)" }
          if (-not (Has $uninstallLog 'asked to quit, it had gone')) { Fail "the uninstaller did not close the open Simpl" }
          # (its last moment, taking its own .exe and the folder away, comes just after it exits)
          $until = (Get-Date).AddSeconds(30)
          while ((Test-Path $dir) -and ((Get-Date) -lt $until)) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dir) { Get-ChildItem -Recurse $dir | ForEach-Object { Write-Host "left: $($_.FullName)" }; Fail "$dir is still there after uninstalling" }
          if (Test-Path $startMenu) { Fail "the Start menu shortcut is still there after uninstalling" }
          if (Test-Path $entry) { Fail "Simpl is still in Settings > Apps after uninstalling" }
          if (-not (Test-Path $kept)) { Fail "uninstalling took what Simpl keeps ($data)" }
          Keep-Logs
          Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue
          Write-Host "Simpl-Setup.exe: installed, opened, pictured, updated over an open Simpl, recovered from an update that could not finish, and uninstalled with Simpl open, as it should be"

          # 6. installed again, then uninstalled from Simpl itself, as Settings > General's Uninstall Simpl does it
          #    (--uninstall yes: its sheet's Uninstall, what Simpl keeps kept, Support/Uninstall.cs): Simpl, opened as
          #    the Start menu opens it, starts its uninstaller and quits -- for real, not to the notification area -- so
          #    the uninstaller finds it gone; then the folder, the shortcut and the entry gone, and what Simpl keeps kept
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content $kept 'what Simpl keeps'
          # (this Simpl's log apart from the default profile's kept above)
          $simplLogs.Remove('profile-default')
          $simplLogs['profile-default-uninstall'] = $data
          if (Test-Path $inAppLog) { Remove-Item -Force $inAppLog }
          $p = Start-Process -FilePath dist\Simpl-Setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CLOSEAPPLICATIONS', "/DIR=`"$dir`"", "/LOG=`"$againLog`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "Simpl-Setup.exe, run again, exited with $($p.ExitCode)" }
          if (-not (Test-Path $exe) -or -not (Test-Path $entry)) { Fail "Simpl was not installed again in $dir" }
          $self = Start-Process -FilePath $exe -ArgumentList @('--uninstall', 'yes') -WorkingDirectory $dir -PassThru
          $null = $self.Handle
          if (-not $self.WaitForExit(60000)) { Fail "Simpl, asked to uninstall itself, was still open after a minute" }
          if (-not (Has (Join-Path $data 'simpl.log') 'uninstall: .*unins000\.exe started')) { Fail "Simpl did not start its uninstaller" }
          # (the uninstaller: unins000.exe, which copies itself to %TEMP% and runs the copy -- its second phase, given
          #  /SECONDPHASE="<unins000.exe>", which takes the files away -- and waits for it; either running is the
          #  uninstall not done)
          $unins = Join-Path $dir 'unins000.exe'
          function Get-Uninstaller {
            @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
              $line = "$($_.CommandLine)"
              ("$($_.ExecutablePath)" -eq $unins) -or ($line.Contains('/SECONDPHASE=') -and $line.IndexOf($unins, [StringComparison]::OrdinalIgnoreCase) -ge 0)
            })
          }
          $began = Get-Date; $seen = $false
          while ($true) {
            $running = Get-Uninstaller
            $took = ((Get-Date) - $began).TotalSeconds
            if ($running.Count -gt 0) { $seen = $true }
            elseif ($seen -or -not (Test-Path $dir)) { break }
            elseif ($took -gt 30) { Fail "Simpl's uninstaller was never seen running, and $dir is still there" }
            if ($took -gt 180) {
              foreach ($r in $running) { Write-Host "still running: $($r.CommandLine)"; Stop-Process -Id $r.ProcessId -Force -ErrorAction SilentlyContinue }
              Fail "Simpl's uninstaller did not finish in three minutes (waiting on a box of its own?)"
            }
            Start-Sleep -Milliseconds 500
          }
          Write-Host "Simpl quit and its uninstaller ran ($([math]::Round(((Get-Date) - $began).TotalSeconds)) s after Simpl had gone)"
          # (its last moment, taking its own .exe and the folder away, comes just after it exits)
          $until = (Get-Date).AddSeconds(30)
          while ((Test-Path $dir) -and ((Get-Date) -lt $until)) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dir) { Get-ChildItem -Recurse $dir | ForEach-Object { Write-Host "left: $($_.FullName)" }; Fail "$dir is still there after Simpl uninstalled itself" }
          if (Test-Path $startMenu) { Fail "the Start menu shortcut is still there after Simpl uninstalled itself" }
          if (Test-Path $entry) { Fail "Simpl is still in Settings > Apps after it uninstalled itself" }
          if (-not (Test-Path $kept)) { Fail "Simpl's own uninstall took what Simpl keeps ($data), though it was to keep it" }
          # (Simpl quits by itself as it starts the uninstaller; the uninstaller asking it to, as it asks a Simpl left in
          #  the notification area, is said -- not failed: the two may cross)
          if (Has (Join-Path $data 'simpl.log') 'quit: asked by Simpl') { Write-Host "::warning::the uninstaller Simpl started had to ask Simpl to quit" }
          Keep-Logs
          Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue
          Write-Host "Uninstall Simpl, from Simpl itself: it quit, its uninstaller took the program, its shortcut and its entry away, and what Simpl keeps was kept"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-fluent-part-installer
          path: shots

  # (what the parts made, read before anyone has to: every picture each part was to take there and showing something —
  #  scripts/dev/check-shots.py — and every Simpl's log free of exceptions, crashes and errors — scan-logs.py; what is
  #  plain or harmless on purpose is in shot-checks.json and log-checks.json, each with its reason. The performance
  #  walk's part is not waited for: it only reports)
  checks:
    name: Pictures and logs checked
    needs: [build, pictures, installer]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/dev
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-fluent-part-[0-9]*
          path: shots
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-fluent-part-installer
          path: shots
      - name: Every picture shows something
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/py" && "$RUNNER_TEMP/py/bin/pip" install -q pillow
          cat shots/expected-part-*.txt > expected.txt
          "$RUNNER_TEMP/py/bin/python" scripts/dev/check-shots.py shots --app windows --expect expected.txt --report shot-checks.txt
      - name: The logs are clean
        if: ${{ !cancelled() }}
        run: python3 scripts/dev/scan-logs.py --app windows 'shots/profile-*.log'

  shots:
    name: The pictures, together
    needs: [build, pictures, installer, perf, checks]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: windows-fluent-shots
          pattern: windows-fluent-part-*
          delete-merged: true

  publish:
    name: Publish the preview
    needs: [prior, build, pictures, installer, tests, checks]
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.preview) || contains(github.event.head_commit.message, '[preview]')) && (needs.prior.outputs.found == 'true' || (needs.build.result == 'success' && needs.pictures.result == 'success' && needs.installer.result == 'success' && needs.tests.result == 'success' && needs.checks.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ needs.prior.outputs.found != 'true' }}
        with:
          pattern: release*
          merge-multiple: true
          path: release
      - name: The green run's build
        if: ${{ needs.prior.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE: ${{ needs.prior.outputs.promote }}
        run: |
          if [ -n "$PROMOTE" ]; then
            # (a beta promoted: the two files its release carries, byte for byte what the testers installed)
            gh release download "$PROMOTE" -R "${{ github.repository }}" -p Simpl-Setup.exe -p Simpl-Windows-x64.zip -D release
          else
            # (a run from before the build was kept as one "release": its installer and its zip apart)
            # (the zip as "release" and the installer as "release-setup"; a run from before kept both as "release", and
            #  one from before that each apart)
            run="${{ needs.prior.outputs.run }}"
            get() { gh run download "$run" -R "${{ github.repository }}" -n "$1" -D release 2>/dev/null; }
            get release || get Simpl-Windows-x64
            [ -f release/Simpl-Setup.exe ] || get release-setup || get Simpl-Setup
          fi
          ls -la release
          test -f release/Simpl-Setup.exe && test -f release/Simpl-Windows-x64.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # (a push publishes only when its commit's subject line asks for a [preview]: the word in a commit's body —
          #  a message that only speaks of it — is no ask)
          if [ "${{ github.event_name }}" = "push" ]; then
            shopt -s nocasematch
            case "${HEAD_MESSAGE%%$'\n'*}" in
              *"[preview]"*) ;;
              *) echo "[preview] is in the commit's body, not its subject line: nothing published"; exit 0 ;;
            esac
            shopt -u nocasematch
          fi
          # (the number the build carries — "0.2.3 (v041)" — is its own run's: the one published, when it is reused)
          n=$(printf '%03d' "${{ needs.prior.outputs.number || github.run_number }}")
          sha="${{ needs.prior.outputs.sha || github.sha }}"
          tag="windows-fluent-v$n"
          title="Simpl for Windows — Windows 11 look, preview (v$n)"
          # (a push's [preview] is a beta, always: the usual release, which every installed Simpl takes -- 0.3.0 and
          #  earlier, which install it by themselves, too -- comes only from Run workflow with beta off, so a commit of
          #  anyone's that happens to carry the word never reaches every PC)
          beta="${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.beta) }}"
          critical="${{ github.event_name == 'workflow_dispatch' && inputs.critical }}"
          # (a beta, asked for by Run workflow ▸ beta or a push's [preview]: a tag of its own, which Simpl's Updates reads
          #  as a beta and offers only with Get beta updates on -- and which a Simpl from before the beta channel, 0.3.0
          #  and earlier, never reads at all: it lists windows-fluent-v<run> alone. Titled with the version its commit's
          #  SimplFluent.csproj gives, the commit published, from_run's too. Run workflow ▸ promote publishes a beta's
          #  own files again with beta off: the usual release, for everyone)
          if [ "$beta" = "true" ]; then
            git fetch -q --depth=1 origin "$sha"
            v=$(git show "$sha:windows/SimplFluent/SimplFluent.csproj" | sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' | head -1)
            test -n "$v"
            tag="windows-fluent-beta-v$n"
            title="Simpl for Windows $v beta (v$n)"
          fi
          # (the installer first, the portable zip beside it; Simpl's own Updates finds Simpl-Setup.exe by its name)
          test -f release/Simpl-Setup.exe
          # (a Critical Update, asked for by Run workflow: its notes say so and carry the mark Simpl's Updates looks for,
          #  windows/SimplFluent/Support/Updates.cs -- every installed Simpl older than it puts it in at its next check,
          #  whatever its update settings, as the Mac's do; a beta's, only those getting beta updates. A beta's notes
          #  begin by saying how to get it. RELEASE_NOTES.md itself is left as it is)
          notes=windows/SimplFluent/RELEASE_NOTES.md
          if [ "$beta" = "true" ] || [ "$critical" = "true" ]; then
            notes="$RUNNER_TEMP/notes.md"
            {
              if [ "$beta" = "true" ]; then
                printf '**A beta, to try before everyone else.** Simpl offers it only to a PC with **Settings ▸ Updates ▸ Get beta updates** on. To try it: download **Simpl-Setup.exe** below and open it (it installs over the Simpl you have, your settings and sign-in as they were), then turn on **Get beta updates**, so each next beta comes by itself. Turning it off later keeps this version until a newer usual release comes out.\n\n'
              fi
              cat windows/SimplFluent/RELEASE_NOTES.md
              if [ "$critical" = "true" ] && [ "$beta" = "true" ]; then
                printf '\n\n**This is a Critical Update for beta testers.** Every Simpl for Windows installed with Simpl-Setup.exe that gets beta updates installs it at its next update check, whatever its other update settings.\n<!-- simpl-critical -->\n'
              elif [ "$critical" = "true" ]; then
                printf '\n\n**This is a Critical Update.** Every Simpl for Windows installed with Simpl-Setup.exe installs it at its next update check, whatever its update settings.\n<!-- simpl-critical -->\n'
              fi
            } > "$notes"
            if [ "$critical" = "true" ]; then echo "published as a Critical Update"; fi
            if [ "$beta" = "true" ]; then echo "published as a beta"; fi
          fi
          gh release create "$tag" release/Simpl-Setup.exe release/Simpl-Windows-x64.zip --target "$sha" --prerelease \
            --title "$title" \
            --notes-file "$notes"
          echo "https://github.com/${{ github.repository }}/releases/tag/$tag"
          # (Simpl 0.3.0 and earlier read only the first 40 releases GitHub lists for the repository, the Mac's and the
          #  extension's among them, and in GitHub's order, which is not quite the order of publishing: a usual release
          #  of an older commit, a beta promoted days on, can land below them, and those copies never see it. They
          #  cannot be changed now -- said here, so a newer commit's run can be published for them)
          if [ "$beta" != "true" ] && ! gh api "repos/${{ github.repository }}/releases?per_page=40" --jq '.[].tag_name' | grep -qx "$tag"; then
            echo "::warning::$tag is not among the first 40 releases GitHub lists: Simpl for Windows 0.3.0 and earlier do not see it (0.3.1 and later read 100). A newer commit's green run published as the usual release reaches them."
          fi
