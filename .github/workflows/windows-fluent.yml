          # Cell Explorer opened plainly under a still pointer — the pointer put in the middle of the screen, over the cell,
          # before Simpl starts; alone on the runner, so no other copy of Simpl is under it or moves it: nothing may show as
          # pointed at (in 1.3.78 the part under it did: its name over the cell, its label ringed, the cell tinted in the
          # accent until a click) — the view's log must name nothing pointed at before its picture (checked below)
          function PointerShot($name, $part, $extra) {
            if ($shard -ne $part) { return }
            $script:mine += $name
            foreach ($p in $script:running) { if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } }
            Add-Type -AssemblyName System.Windows.Forms
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($screen.Width / 2), [int]($screen.Height / 2))
            Write-Host "${name}: the pointer at $([System.Windows.Forms.Cursor]::Position)"
            $prof = Join-Path $env:RUNNER_TEMP "profile-$name"
            $argList = @('--shot', "$PWD/shots/$name.png", '--shot-after', '50', '--profile', $prof, '--window-size', '1366x778') + $mock + $extra
