            for ($i = 0; $i -lt 60; $i++) { try { Invoke-WebRequest -Uri "http://localhost:$port/" -TimeoutSec 2 -SkipHttpErrorCheck | Out-Null; break } catch { Start-Sleep -Milliseconds 500 } }
