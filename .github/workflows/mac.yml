# Simpl for Mac (mac/): built with Xcode 26 for macOS, signed to run locally, and run against the mock Canvas: every
# screen pictured in light and dark (scripts/dev/mac-shots.sh), the pictures, the build's errors and the app itself
# pushed to the mac-shots branch to be looked at. Nothing is published here. (1.3.1: built without an index; the
# pictures taken by several copies of the app at once, each as soon as it has settled — mac-shots.sh.) (1.3.80) Every
# run — a push's and Run workflow's alike — takes the whole set, what a push took and what "full" took (423 pictures;
# "quick" is the same set now), in four parts at once: each part on a Mac of its own that builds the app itself from
# the last build (the same incremental build in each, so no part waits for another's) and takes its share of the
# pictures, shared out by the time each took in a run (scripts/dev/baselines/mac-shot-times.txt) so that the four end
# together; then one Linux job puts the parts together, checks them as one and pushes them to mac-shots. Beside the
# parts, a fifth Mac builds the release's app ahead (a beta's, signed, for mac-native-release.yml to notarize and
# publish without compiling) and runs the models' checks, for the first few minutes. A newer push cancels the run
# before it. Run workflow → none builds without pictures; "Build from clean" compiles every file. Why four parts: the
# account runs five Macs at once, and the owner asked for the push to a beta in half the time; once the fifth is done
# (minutes in), a release (now a minute or two) has a Mac of its own — one started in those first minutes waits for
# it, and a release with Package's Mac job has one of them wait for a part to finish (docs/CI.md). The number of parts
# is the matrix's list below alone.
name: Mac app

on:
  push:
    paths:
      - 'mac/**'
      - 'ios/SimplCourses/App/AppSession.swift'
      - 'ios/SimplCourses/App/SchoolPickerView.swift'
      - 'ios/SimplCourses/Native/Models.swift'
      - 'ios/SimplCourses/Native/CourseModels.swift'
      - 'ios/SimplCourses/Native/QuizModels.swift'
      - 'ios/SimplCourses/Native/QuizRun.swift'
      - 'ios/SimplCourses/Native/Reminders.swift'
      - 'ios/SimplCourses/Native/Activity.swift'
      - 'ios/SimplCourses/Native/Router.swift'
      - 'ios/SimplCourses/Web/**'
      - 'extension/content/app/native-app.js'
      - 'scripts/dev/make-mac-project.py'
      - 'scripts/dev/mac-shots.sh'
      - 'scripts/dev/mock-brightspace.mjs'
      - 'scripts/dev/check-shots.py'
      - 'scripts/dev/scan-logs.py'
      - 'scripts/dev/check-warnings.py'
      - 'scripts/dev/*-checks.json'
      - 'scripts/dev/baselines/mac-*'
      - 'scripts/dev/swift-checks/**'
      - 'scripts/release-mac-native.sh'
      - '.github/workflows/mac.yml'
  workflow_dispatch:
    inputs:
      shots:
        description: 'Which pictures: full (every screen, light and dark: what every run takes; quick is the same), none (the build alone)'
        default: full
        type: choice
        options: [full, quick, none]
      clean:
        description: 'Build from clean (every file compiled, so every warning is seen: the baseline of scripts/dev/check-warnings.py)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mac-app
  cancel-in-progress: true # (a newer push cancels the run before it: only the newest is worth waiting for)

jobs:
  # (1.3.82) Beside the parts, on a Mac of its own: Simpl for Mac's release app built ahead, then the models' checks.
  #
  # The release app: built and signed with the team's Developer ID exactly as a beta's release builds it
  # (scripts/release-mac-native.sh with MAC_RELEASE_STEP=build: compiled a file at a time, optimized, for Apple silicon
  # and Intel, the hardened runtime and a secure timestamp — only the certificate's two secrets and the team are given
  # here, never the notary's), checked as the release checks it, and kept with a stamp of this commit, its version and
  # build by a cache keyed by the commit (mac-release-app-beta-<sha>: a cache, not an artifact, so an app not yet
  # notarized is never downloadable). mac-native-release.yml, run on this commit, finds it, checks it again and only
  # notarizes, staples and publishes it — a minute or two instead of nine; a release proper (compiled whole-module), a
  # commit this did not run on or an app that fails its checks is built by the release as before. Each push's release
  # build is also kept (mac-release-beta-<sha>) for the next to compile from: the releases' own builds were kept only
  # by the releases, so a release compiled every change since the last (68 and 78 files, 8 and 10 minutes, for 1.3.80
  # and 1.3.79), most of the module for both kinds of Mac; now it is one push's. A version already released is still
  # built, for that, but not kept. The certificate's keychain is removed as soon as the app is built.
  #
  # The models that need no window, checked on their own — the elements' data, VSEPR's shapes, the biology toolkit's
  # models and self-check (every Foundation-only file in mac/Simpl/Tools/Biology/Model, so a tool's builder adds files
  # there without touching this), (1.3.80) the chemistry tools' (every file in mac/Simpl/Tools/Chemistry/Model), (tools)
  # the Study Planner's planner (mac/Simpl/Tools/Planner/Model), Verb Conjugations' engine (mac/Simpl/Tools/Verbs/Model,
  # read with the languages' data files in mac/Simpl/Resources/Verbs) and the
  # live checks' plan, fingerprint and comparison (mac/Simpl/Engine/LivePlan.swift): scripts/dev/swift-checks/main.swift
  # compiled with the files it checks and run. Compiling takes four minutes and running them under a second, so what
  # was compiled is kept (a cache keyed by every file it is compiled from, this workflow and the compiler's version)
  # and only run again while none of those has changed — most runs, in seconds.
  models:
    name: Models, and the release app built ahead
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The last release build
        uses: actions/cache/restore@v4
        with:
          path: build/mac-native
          key: mac-release-beta-${{ github.sha }}
          restore-keys: mac-release-beta-
      - name: Unchanged files keep their dates
        run: python3 scripts/dev/mtime-cache.py restore build/mac-native
      - name: The release app, built and signed as a beta's release builds it
        id: ahead
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
          MAC_BETA: '1'
          MAC_RELEASE_STEP: build
        run: |
          if [ -z "$MAC_CERT_P12" ] || [ -z "$APPLE_TEAM_ID" ]; then echo "::notice::no signing certificate in this repository's secrets: no release app built ahead"; exit 0; fi
          bash scripts/release-mac-native.sh
      - name: The certificate's keychain removed
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/simpl-native.keychain-db" 2>/dev/null || true
      - name: Keep this release build for the next
        if: ${{ !cancelled() && steps.ahead.outcome == 'success' && hashFiles('build-mac-native.log') != '' }}
        run: python3 scripts/dev/mtime-cache.py save build/mac-native
      - name: Save the release build
        if: ${{ !cancelled() && steps.ahead.outcome == 'success' && hashFiles('build-mac-native.log') != '' }}
        uses: actions/cache/save@v4
        with:
          path: build/mac-native
          key: mac-release-beta-${{ github.sha }}
      - name: Keep the app for the release
        if: ${{ !cancelled() && steps.ahead.outcome == 'success' && hashFiles('prebuilt/stamp.txt') != '' }}
        uses: actions/cache/save@v4
        with:
          path: prebuilt
          key: mac-release-app-beta-${{ github.sha }}
      - name: The compiler
        if: ${{ !cancelled() }}
        id: swift
        run: echo "version=$(swiftc --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: The models' checks as compiled before from the same files
        id: models-kept
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: model-checks
          key: mac-models-${{ steps.swift.outputs.version }}-${{ hashFiles('mac/Simpl/Tools/PeriodicData.swift', 'mac/Simpl/Tools/PeriodicExtraData.swift', 'mac/Simpl/Tools/MoleculeShape.swift', 'mac/Simpl/Tools/Biology/Model/*.swift', 'mac/Simpl/Tools/Chemistry/Model/*.swift', 'mac/Simpl/Tools/Physics/Model/*.swift', 'mac/Simpl/Tools/Model/*.swift', 'mac/Simpl/Tools/Planner/Model/*.swift', 'mac/Simpl/Tools/Verbs/Model/*.swift', 'mac/Simpl/Resources/Verbs/*.json', 'mac/Simpl/Engine/LivePlan.swift', 'scripts/dev/swift-checks/**', '.github/workflows/mac.yml') }}
      - name: The models' checks
        id: models
        if: ${{ !cancelled() }}
        run: |
          if [ ! -x model-checks/run ]; then
            mkdir -p model-checks
            swiftc -O -o model-checks/run mac/Simpl/Tools/PeriodicData.swift mac/Simpl/Tools/PeriodicExtraData.swift \
              mac/Simpl/Tools/MoleculeShape.swift mac/Simpl/Tools/Biology/Model/*.swift mac/Simpl/Tools/Chemistry/Model/*.swift \
              mac/Simpl/Tools/Physics/Model/*.swift mac/Simpl/Tools/Model/*.swift mac/Simpl/Tools/Planner/Model/*.swift mac/Simpl/Tools/Verbs/Model/*.swift mac/Simpl/Engine/LivePlan.swift \
              scripts/dev/swift-checks/main.swift scripts/dev/swift-checks/StudyChecks.swift
          fi
          model-checks/run
      # (kept once they have passed, whatever the release app's build did)
      - name: Keep the models' checks as compiled
        if: ${{ !cancelled() && steps.models.outcome == 'success' && steps.models-kept.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: model-checks
          key: ${{ steps.models-kept.outputs.cache-primary-key }}

  # (1.3.80) The app built and pictured, in four parts at once (one, the build alone, for Run workflow → none): each
  # part builds the app as the run before left it, and takes the pictures mac-shots.sh shares out to it (SHARD of
  # SHARDS: every part first walks the whole list to share it out alike, then takes its own). Part 0 also keeps the
  # build for the next run and zips the app for mac-shots. Each part's files — its pictures, consoles, shot-times.txt,
  # the plan of every part's pictures, its Mac's load — are an artifact of the run (mac-part-<n>) for the job after,
  # sent whether the part passed or failed (a cancelled run sends nothing, and pushes nothing).
  mac:
    name: Mac (part ${{ matrix.part }})
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false # (a part that fails leaves the others to finish: every picture that can be taken is)
      matrix:
        part: ${{ fromJSON(inputs.shots == 'none' && '[0]' || '[0, 1, 2, 3]') }}
    env:
      SHOTS: ${{ inputs.shots || 'full' }}
    steps:
      - uses: actions/checkout@v4
      # (a project or a What's New that fails here is said in FAILED too, as a build that failed is: nothing more is
      #  run, and mac-shots says why)
      - name: The project is what the generator writes
        run: |
          mkdir -p shots
          python3 scripts/dev/make-mac-project.py
          git diff --exit-code -- mac/Simpl.xcodeproj || { echo "mac/Simpl.xcodeproj differs from scripts/dev/make-mac-project.py's" | tee shots/FAILED | sed 's/^/::error::/'; exit 1; }
          # (1.3.3) the Mac's own What's New has an entry for this version, first
          v=$(sed -n "s/^MARKETING_VERSION = '\([^']*\)'.*/\1/p" scripts/dev/make-mac-project.py)
          n=$(grep -m1 -o 'Release(version: "[^"]*"' mac/Simpl/Support/MacWhatsNew.swift | sed 's/.*"\(.*\)"/\1/')
          [ "$v" = "$n" ] || { echo "mac/Simpl/Support/MacWhatsNew.swift's newest entry is $n, the app is $v" | tee shots/FAILED | sed 's/^/::error::/'; exit 1; }
      # (1.3.1) the last build's intermediates, and every file not changed since dated as it was then: only what changed
      # is compiled again (scripts/dev/mtime-cache.py)
      - name: The last build
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@v4
        with:
          path: build
          key: mac-debug-${{ github.sha }}
          restore-keys: mac-debug-
      - name: Unchanged files keep their dates
        run: python3 scripts/dev/mtime-cache.py restore build
      - name: Build for macOS
        run: |
          set -o pipefail
          xcodebuild -version
          mkdir -p shots
          build() {
            xcodebuild -project mac/Simpl.xcodeproj -scheme Simpl -configuration Debug -destination 'platform=macOS' \
              -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
              COMPILER_INDEX_STORE_ENABLE=NO ONLY_ACTIVE_ARCH=YES -showBuildTimingSummary build 2>&1 \
              | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          }
          build
          # (an incremental build that failed is tried once more from clean: a stale intermediate is never the answer)
          if ! grep -q "BUILD SUCCEEDED" build.log && [ -f build/.mtimes-ns.json ]; then
            echo "::warning::incremental build failed; building clean"
            rm -rf build
            build
          fi
          grep -E "error:" -B2 -A8 build.log | head -600 > shots/build-errors.txt || true
          grep -E "warning:.*mac/Simpl/" build.log | sort -u | head -300 > shots/build-warnings.txt || true
          sed -n '/Build Timing Summary/,$p' build.log | head -80 > shots/build-timing.txt || true
          grep -q "BUILD SUCCEEDED" build.log || { echo "build failed" > shots/FAILED; cat shots/build-errors.txt | head -300; }
      # (part 0: the build kept for the next run, and the app zipped for mac-shots while the pictures are taken)
      - name: Keep this build for the next
        if: matrix.part == 0 && hashFiles('shots/FAILED') == ''
        run: |
          python3 scripts/dev/mtime-cache.py save build
          touch "$RUNNER_TEMP/zipping"
          (cd build/Build/Products/Debug && ditto -c -k --keepParent Simpl.app "$RUNNER_TEMP/Simpl.app.zip.part" && mv "$RUNNER_TEMP/Simpl.app.zip.part" "$RUNNER_TEMP/Simpl.app.zip") > /dev/null 2>&1 &
      - name: Save the build
        if: matrix.part == 0 && hashFiles('shots/FAILED') == ''
        uses: actions/cache/save@v4
        with:
          path: build
          key: mac-debug-${{ github.sha }}
      - name: Mock Canvas
        if: hashFiles('shots/FAILED') == '' && env.SHOTS != 'none'
        run: |
          node scripts/dev/mock-canvas.mjs 8800 8801 > mock.log 2>&1 &
          node scripts/dev/mock-canvas.mjs 8802 8803 --login > mock-login.log 2>&1 & # (one that asks for a sign-in first: the sign-in picture)
          node scripts/dev/mock-brightspace.mjs 8860 --open > mock-d2l.log 2>&1 &
          # (each up once it answers)
          for _ in $(seq 1 50); do
            curl -s -o /dev/null http://localhost:8800/ && curl -s -o /dev/null http://localhost:8802/login/canvas && curl -s -o /dev/null http://localhost:8860/d2l/home && break
            sleep 0.2
          done
          curl -s -o /dev/null -w "mock %{http_code}\n" http://localhost:8800/
          curl -s -o /dev/null -w "mock sign-in %{http_code}\n" http://localhost:8802/login/canvas
          curl -s -o /dev/null -w "mock brightspace %{http_code}\n" http://localhost:8860/d2l/home
          if [ "${{ matrix.part }}" = 0 ]; then system_profiler SPDisplaysDataType | grep -E "Resolution|Display Type" || true; fi
      # (this part's share of the pictures, five copies of the app at once as on one Mac before; its own time limit, well
      #  past a part's ten minutes or so, so a part held up still sends what it took and the run says what is missing)
      - name: Screens
        if: hashFiles('shots/FAILED') == '' && env.SHOTS != 'none'
        timeout-minutes: 25
        env:
          SHARD: ${{ matrix.part }}
          SHARDS: ${{ strategy.job-total }}
          JOBS: 5
        run: |
          # (the Mac's cores and memory every ten seconds or so beside the pictures — load-part<n>.txt on mac-shots: what
          #  a part is held by, for choosing JOBS and the number of parts)
          (while :; do echo "$(date +%T) $(top -l 2 -n 0 -s 1 | grep -E '^(CPU usage|PhysMem)' | tail -2 | tr '\n' ' ')"; sleep 8; done) > "shots/load-part$SHARD.txt" 2>&1 &
          echo $! > "$RUNNER_TEMP/load.pid"
          bash scripts/dev/mac-shots.sh
          kill "$(cat "$RUNNER_TEMP/load.pid")" 2>/dev/null || true
      # (1.3.76) what the app kept while it was pictured is sealed by its vault (mac/Simpl/Support/Vault.swift), whose key
      # is kept in the login Keychain: the extension's storage, the kept answers and the flashcards each start "SIMPLENC".
      # The sign-in and the cookies are Keychain items of their own, so no login.bin or cookies.bin may be found (an
      # early 1.3.76 build's files). Each worker of mac-shots.sh has a home of its own (/tmp/simpl-shots.*/home*); this
      # Mac's own home is looked in too. Where the vault's key is (vault.key's mode) is printed: "keychain", or "file"
      # when the runner's Keychain would not take it (a notice, not a failure); "se" (the Secure Enclave) fails. (1.3.80:
      # in every part, on the homes of its own pictures — after pictures cut short too.)
      - name: Kept data is encrypted
        if: ${{ !cancelled() && hashFiles('shots/FAILED') == '' && env.SHOTS != 'none' }}
        run: |
          dirs=()
          enclave=0
          for h in /tmp/simpl-shots.*/home* "$HOME"; do
            for d in "Application Support/SimplCourses" "Application Support/com.simplcourses.mac" "Application Support/Simpl" "Caches/Answers"; do
              if [ -d "$h/Library/$d" ]; then dirs+=("$h/Library/$d"); fi
            done
            key="$h/Library/Application Support/Simpl/vault.key"
            if [ -f "$key" ]; then
              mode="$(grep -o '"mode":"[a-z]*"' "$key" | cut -d'"' -f4 || true)"
              echo "vault.key in $h: mode ${mode:-unknown}"
              if [ "$mode" = file ]; then echo "::notice::the vault's key in $h is in vault.key itself: this runner's Keychain would not take it"; fi
              if [ "$mode" = se ]; then enclave=$((enclave + 1)); echo "::error::the vault's key in $h is still held by the Secure Enclave"; fi
            fi
          done
          if [ ${#dirs[@]} -eq 0 ]; then echo "::warning::no kept data found to check"; exit 0; fi
          checked=0
          plain=0
          while IFS= read -r -d '' f; do
            checked=$((checked + 1))
            if [ "$(head -c 8 "$f")" != SIMPLENC ]; then plain=$((plain + 1)); echo "::error::not encrypted: $f"; fi
          done < <(find "${dirs[@]}" -type f -size +0 \( -name storage.json -o -name flashcards.json -o -path '*/Caches/Answers/*' \) -print0)
          outside=0
          while IFS= read -r -d '' f; do
            outside=$((outside + 1))
            echo "::error::kept outside the Keychain: $f"
          done < <(find "${dirs[@]}" -type f \( -name login.bin -o -name cookies.bin \) -print0)
          echo "$checked kept files checked, $plain not encrypted; $outside sign-in or cookie files outside the Keychain"
          if [ "$checked" -eq 0 ]; then echo "::warning::no kept data found to check"; fi
          [ "$plain" -eq 0 ] && [ "$outside" -eq 0 ] && [ "$enclave" -eq 0 ]
      # (part 0 sends the build's files — its log for the warnings, its tail, the app zipped; the others built the same,
      #  and send theirs only when their build failed. A part whose pictures were cut short — its time limit — has its
      #  apps and its load log stopped, the warm-ups' files dropped and this Mac's crash reports kept, as mac-shots.sh
      #  does at its end. Not when the run is cancelled: a newer push's run waits for these Macs.)
      - name: This part's files
        if: ${{ !cancelled() }}
        run: |
          mkdir -p shots
          kill "$(cat "$RUNNER_TEMP/load.pid" 2>/dev/null)" 2>/dev/null || true
          pkill -x Simpl 2>/dev/null || true
          rm -f shots/warmup* shots/console-warmup*
          for f in "$HOME"/Library/Logs/DiagnosticReports/*Simpl*; do
            if [ -f "$f" ]; then head -c 600000 "$f" > "shots/crash-$(basename "$f" | tr ' ' '-').txt"; fi
          done
          if [ "${{ matrix.part }}" = 0 ]; then
            tail -c 900000 build.log > shots/build-tail.log 2>/dev/null || true
            cp build.log shots/build.log 2>/dev/null || true
            # (the zip begun beside the pictures, waited for; else made now)
            if [ -f "$RUNNER_TEMP/zipping" ]; then
              for _ in $(seq 1 120); do [ -f "$RUNNER_TEMP/Simpl.app.zip" ] && break; sleep 0.5; done
            fi
            if [ -f "$RUNNER_TEMP/Simpl.app.zip" ]; then mv "$RUNNER_TEMP/Simpl.app.zip" shots/Simpl.app.zip
            elif [ -d build/Build/Products/Debug/Simpl.app ]; then (cd build/Build/Products/Debug && ditto -c -k --keepParent Simpl.app "$GITHUB_WORKSPACE/shots/Simpl.app.zip") || true; fi
          elif [ ! -f shots/FAILED ]; then
            rm -f shots/build-errors.txt shots/build-warnings.txt shots/build-timing.txt
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mac-part-${{ matrix.part }}
          path: shots
          retention-days: 3
          compression-level: 1 # (the pictures and the zip are compressed already)
          overwrite: true # (a part run again replaces its files)
      - name: The build passed
        run: test ! -f shots/FAILED

  # (1.3.80) The parts put together (each part's files side by side as one run's: the lists each kept, shot-times.txt
  # and phone-test.txt, joined; the plan of every part's pictures, the same in each — and held to be — kept once; a
  # name two parts sent, a crash report of the same second, is kept from both), checked as one, and pushed to mac-shots
  # as one run's — on Linux, which needs no Mac and starts in seconds. What the apps said is read here (mac-shots.sh
  # with SHOTS=check: Send from Phone, the live checks, a post's web view that never measured), every picture of the
  # plan must be there and show something, the consoles must be clean and the build must add no warning (docs/CI.md:
  # their lists of what is plain or harmless on purpose are shot-checks.json, log-checks.json and baselines/, each
  # entry with its reason). A part that failed or sent nothing still has the others' pictures and its own failure's
  # files pushed, and the run fails: what is missing is named. A cancelled run (a newer push) pushes nothing.
  shots:
    name: The pictures, checked and pushed
    needs: mac
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHOTS: ${{ inputs.shots || 'full' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/dev
      - name: Pillow, for the pictures' check (installed beside the parts' download)
        run: (python3 -m venv "$RUNNER_TEMP/py" && "$RUNNER_TEMP/py/bin/pip" install -q pillow && touch "$RUNNER_TEMP/py/ready") > "$RUNNER_TEMP/pip.log" 2>&1 &
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-part-*
          path: parts
      - name: The parts put together
        run: |
          mkdir -p shots
          bad=""
          for p in parts/mac-part-*; do
            [ -d "$p" ] || continue
            k="${p##*-}"
            echo "part $k: $(find "$p" -name '*-app.png' | wc -l | tr -d ' ') pictures"
            # (each part shared the whole set out before it took its own, from the same files: the plans are one)
            if [ -f "$p/shot-plan.txt" ]; then
              if [ ! -f shots/shot-plan.txt ]; then cp "$p/shot-plan.txt" shots/shot-plan.txt
              elif ! cmp -s "$p/shot-plan.txt" shots/shot-plan.txt; then
                echo "::error::part $k shared the pictures out otherwise than the part before it (shot-plan.txt): pictures may be missing or taken twice"; bad=yes
              fi
            fi
            for f in "$p"/*; do
              b="${f##*/}"
              case "$b" in
                shot-plan.txt) ;;
                shot-times.txt|phone-test.txt|FAILED) cat "$f" >> "shots/$b" ;;
                build.log) mv "$f" build.log ;;
                build-errors.txt|build-warnings.txt|build-timing.txt) [ -s "shots/$b" ] || mv -f "$f" "shots/$b" ;;
                *)
                  if [ ! -e "shots/$b" ]; then mv "$f" shots/
                  elif [ "${b%.*}" != "$b" ]; then mv "$f" "shots/${b%.*}-part$k.${b##*.}"
                  else mv "$f" "shots/$b-part$k"; fi ;;
              esac
            done
          done
          # (every part the plan names sent its files, and part 0 the build's; no picture planned twice)
          if [ -s shots/shot-plan.txt ]; then
            while read -r k; do
              [ -d "parts/mac-part-$k" ] || { echo "::error::no files from part $k: its pictures are missing"; bad=yes; }
            done < <(awk '{ print $2 }' shots/shot-plan.txt | sort -u | sed 's/^part//')
            twice="$(awk '{ print $1 }' shots/shot-plan.txt | sort | uniq -d | tr '\n' ' ')"
            [ -z "$twice" ] || { echo "::error::pictures in mac-shots.sh's list twice: $twice"; bad=yes; }
          elif [ "$SHOTS" != none ] && [ ! -f shots/FAILED ]; then
            echo "::error::no part sent its plan of the pictures (shot-plan.txt)"; bad=yes
          fi
          [ -f build.log ] || { echo "::error::part 0 sent no build log"; bad=yes; }
          [ -z "$bad" ]
      - name: What the apps said
        if: ${{ !cancelled() && hashFiles('shots/FAILED') == '' && env.SHOTS != 'none' }}
        run: OUT=shots SHOTS=check bash scripts/dev/mac-shots.sh
      # (1.3.78) Send from Phone: mac-shots.sh sent files to Hand In's own server as a phone's page does — the page
      # opened, a wrong key refused, a photo and a text file taken, a PDF-only assignment's photos made into one PDF and
      # an mp3 refused — and read the app's consoles for them in the hand-in (shots/phone-check.txt)
      - name: Send from Phone took the files
        if: ${{ !cancelled() && hashFiles('shots/FAILED') == '' && env.SHOTS != 'none' }}
        run: |
          cat shots/phone-test.txt 2>/dev/null || true
          test -s shots/phone-check.txt || { echo "::error::mac-shots.sh wrote no phone-check.txt"; exit 1; }
          if grep -q '^FAIL' shots/phone-check.txt; then grep '^FAIL' shots/phone-check.txt | sed 's/^/::error::/'; exit 1; fi
      # (1.3.80) Live checks: mac-shots.sh's live pictures (light-48*), each alone against a mock of its own, had the
      # screen on show checked every 4 seconds and the mock school changed behind the engine's back; live_check read
      # their consoles (shots/live-check.txt): a check with nothing new drew nothing ("· 0 redraws"), the change was found
      # and only its parts put in place (the counters and the List's row, one course's card, To Do's new row), the next
      # check found nothing new, a course's page was checked at its own pace, and no check went unanswered
      - name: Live checks find what changed
        if: ${{ !cancelled() && hashFiles('shots/FAILED') == '' && env.SHOTS != 'none' }}
        run: |
          test -s shots/live-check.txt || { echo "::error::mac-shots.sh wrote no live-check.txt"; exit 1; }
          cat shots/live-check.txt
          grep -h 'live: ' shots/console-light-48*.txt 2>/dev/null | sed 's/^.*\[Simpl\] //' | head -60 || true
          if grep -q '^FAIL' shots/live-check.txt; then grep '^FAIL' shots/live-check.txt | sed 's/^/::error::/'; exit 1; fi
      - name: Every picture shows something
        if: ${{ !cancelled() && hashFiles('shots/FAILED') == '' && env.SHOTS != 'none' }}
        run: |
          for _ in $(seq 1 240); do [ -f "$RUNNER_TEMP/py/ready" ] && break; sleep 0.5; done
          [ -f "$RUNNER_TEMP/py/ready" ] || { cat "$RUNNER_TEMP/pip.log"; echo "::error::Pillow did not install"; exit 1; }
          # (held to the plan when a part sent it — the step before fails when none did — else to what is there)
          expect=()
          if [ -f shots/shot-plan.txt ]; then expect=(--expect shots/shot-plan.txt); fi
          "$RUNNER_TEMP/py/bin/python" scripts/dev/check-shots.py shots --app mac --pattern '*-app.png' "${expect[@]}" --report shots/shot-checks.txt
      - name: The consoles are clean
        if: ${{ !cancelled() && hashFiles('shots/FAILED') == '' && env.SHOTS != 'none' }}
        run: python3 scripts/dev/scan-logs.py --app mac 'shots/console-*.txt' 'shots/crash-*.txt'
      - name: No new compiler warnings
        if: ${{ !cancelled() && hashFiles('shots/FAILED') == '' && hashFiles('build.log') != '' }}
        run: python3 scripts/dev/check-warnings.py build.log --baseline scripts/dev/baselines/mac-warnings.txt
      - name: Push the pictures to the mac-shots branch
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          echo "${GITHUB_SHA}" > shots/COMMIT
          cd shots
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b mac-shots
          git add -A
          git commit -qm "Mac screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mac-shots && echo PUSHED
      - name: The build passed
        run: test ! -f shots/FAILED
