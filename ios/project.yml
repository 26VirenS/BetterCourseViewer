# XcodeGen spec for the iOS app. `scripts/build-ios-app.sh` turns it into SimplCourses.xcodeproj.
# The app is the student's own Canvas site with the extension injected into it, under Apple's own tab
# bar, navigation bars and native screens (see docs/ios.md); the extension/ folder is bundled as a
# folder reference so the same files ship. Built with Xcode 26 (the iOS 26 SDK draws the bars in Liquid Glass).
name: SimplCourses
options:
  bundleIdPrefix: com.simplcourses
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.3" # the iPhone app's own version, from 1.0 up (the interface it carries is numbered by extension/manifest.json)
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
targets:
  SimplCourses:
    type: application
    platform: iOS
    scheme: # a shared scheme (xcshareddata), which is what Xcode Cloud lists and builds
      gatherCoverageData: false
    sources:
      - path: SimplCourses
        excludes:
          - "Info.plist"
          - "Web/bridge.js"
          - "Web/login.js"
      - path: SimplCourses/Web/bridge.js
        buildPhase: resources # copied into the bundle as-is; ScriptBundle reads it at run time
      - path: SimplCourses/Web/login.js
        buildPhase: resources # the sign-in reader (LoginAssist), read the same way
      - path: ../extension
        type: folder
        buildPhase: resources
    info:
      path: SimplCourses/Info.plist
      properties:
        CFBundleDisplayName: Simpl Courses
        CFBundleName: Simpl Courses
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true # (the simulator suite's mock Canvas on localhost; nothing else is loaded over plain http)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Lets you take a photo when an assignment asks for a file.
        NSPhotoLibraryUsageDescription: Lets you attach a photo or video to an assignment.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplcourses.app # the same record as the Mac app in App Store Connect (one app, two platforms)
        PRODUCT_NAME: Simpl Courses
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
