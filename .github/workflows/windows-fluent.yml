          Shot 'tools-chemistry' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'tools', '--tools-scroll', 'chemistry'))
          Shot 'tools-chemistry-dark' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'tools', '--tools-scroll', 'chemistry'))
          Shot 'chem-lewis' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'tools', '--tool', 'lewis'))
          Shot 'chem-lewis-dark' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'tools', '--tool', 'lewis', '--tool-state', 'O3'))
          Shot 'chem-molecule' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'tools', '--tool', 'molecule'))
          Shot 'chem-atom' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'tools', '--tool', 'atom'))
          Shot 'chem-atom-dark' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'tools', '--tool', 'atom', '--tool-state', 'Cu:orbitals:3d'))
          Shot 'chem-atom-1024' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'tools', '--tool', 'atom', '--tool-state', 'Na:cloud'))
          Shot 'chem-atom-narrow' '780x683' 45 ($mock + @('--appearance', 'dark', '--place', 'tools', '--tool', 'atom', '--tool-state', 'O'))
          Shot 'chem-atom-from-element' '1366x778' 50 ($mock + @('--appearance', 'light', '--place', 'tools', '--tool', 'ptable', '--ptable-element', 'Fe', '--ptable-atoms'))
