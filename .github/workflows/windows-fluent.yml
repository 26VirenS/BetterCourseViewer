            $said = @(Select-String -Path "shots/profile-$name.log" -Pattern 'more from canvas: (.+)$' -ErrorAction SilentlyContinue | ForEach-Object { $_.Matches[0].Groups[1].Value }) | Select-Object -Last 1
            if ($said -notmatch '^History, My Materials \(picture\), Help ') { Write-Host "::error::${name}: More from Canvas was not History, My Materials with its picture, Help ('$said') (shots/profile-$name.log)"; exit 1 }
