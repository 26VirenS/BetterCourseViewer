# Liquid Glass for Windows: Simpl's own glass (windows/Simpl/Components/Glass), shown off in a small app of its own
# (windows/GlassShowcase) — the glass shader compiled with the Windows SDK's fxc, the app published as one portable exe,
# started on the runner for a picture, and published as a pre-release (windows-glass-r<run>) to try on a real PC.
# Nothing here touches Simpl's own builds, releases or update feeds (those read mac-v* releases only).
# (The first candidates built here — liquidImgui and AuroraGlass, r1–r4 — were tried and set aside: windows-glass/README.md.)
name: Windows Liquid Glass

on:
  push:
    branches: [claude/windows-liquid-glass]
    paths:
      - 'windows-glass/**'
      - 'windows/GlassShowcase/**'
      - 'windows/Simpl/Components/Glass/**'
      - 'windows/tools/shaders.ps1'
      - '.github/workflows/windows-glass.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-glass
  cancel-in-progress: true

jobs:
  showcase:
    name: Liquid Glass showcase (WPF, the glass shader)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile the glass shader (fxc, ps_3_0)
        shell: pwsh
        run: ./windows/tools/shaders.ps1
      - name: Publish (one portable exe, .NET inside)
        shell: bash
        run: |
          dotnet publish windows/GlassShowcase/GlassShowcase.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -o dist/LiquidGlassShowcase
          cp windows-glass/showcase-README.txt dist/LiquidGlassShowcase/README-FIRST.txt
          ls -la dist/LiquidGlassShowcase
      - name: Does it start? (a picture of its window)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/LiquidGlassShowcase/LiquidGlassShowcase.exe -ArgumentList '--shot', "$PWD/shot-showcase.png" -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw 'it did not finish' }
          Write-Host "exit code: $($p.ExitCode)"
          if (Test-Path shot-showcase.png.txt) { Get-Content shot-showcase.png.txt }
          if (-not (Test-Path shot-showcase.png)) { throw 'no picture' }
      - name: Zip
        shell: bash
        run: (cd dist && 7z a -tzip -mx=9 ../LiquidGlass-Showcase-win64.zip LiquidGlassShowcase >/dev/null) && ls -la LiquidGlass-Showcase-win64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-showcase
          path: shot-showcase.png*
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-Showcase-win64
          path: LiquidGlass-Showcase-win64.zip

  publish:
    name: Publish the pre-release
    needs: [showcase]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: zips
          pattern: LiquidGlass-*
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="windows-glass-r${{ github.run_number }}"
          gh release create "$tag" zips/*.zip --target "${{ github.sha }}" --prerelease \
            --title "Liquid Glass on Windows — Simpl's own (r${{ github.run_number }})" \
            --notes-file windows-glass/RELEASE_NOTES.md
          echo "https://github.com/${{ github.repository }}/releases/tag/$tag"
