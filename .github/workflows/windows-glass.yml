# Liquid Glass for Windows: the showcase (windows/GlassNative) — Win32 and Direct3D 11, the glass drawn by AuroraGlass's
# renderer (its core compiled in from a pinned copy) with a deep frost, Direct2D and DirectWrite for the backdrop and the
# words. Built with MSVC, started on the runner for a picture, and published as a pre-release (windows-glass-v<run>, zero-padded) to
# try on a real PC. Nothing here touches Simpl's own builds, releases or update feeds (those read mac-v* releases only).
name: Windows Liquid Glass

on:
  push:
    branches: [claude/windows-liquid-glass]
    paths:
      - 'windows-glass/**'
      - 'windows/GlassNative/**'
      - '.github/workflows/windows-glass.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-glass
  cancel-in-progress: true

env:
  AURORA_REPO: https://github.com/VeiQiuLab/AuroraGlass.git
  AURORA_SHA: 9355428a4a04f27a01b8e34fec90b7bfde2f0cf6

jobs:
  showcase:
    name: Liquid Glass showcase (Direct3D 11, AuroraGlass)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch AuroraGlass
        shell: bash
        run: |
          git init -q aurora && cd aurora
          git remote add origin "$AURORA_REPO"
          git fetch -q --depth 1 origin "$AURORA_SHA"
          git checkout -q FETCH_HEAD
      - name: Build (Release, x64)
        shell: bash
        run: |
          cmake -S windows/GlassNative -B build -A x64 -DAURORA_DIR="$PWD/aurora"
          cmake --build build --config Release --parallel
      - name: Package
        shell: bash
        run: |
          out=dist/LiquidGlass
          mkdir -p "$out"
          cp build/Release/LiquidGlass.exe "$out/"
          cp -R build/Release/shaders "$out/shaders"
          cp aurora/LICENSE "$out/LICENSE-AuroraGlass.txt"
          cp windows-glass/showcase-README.txt "$out/README-FIRST.txt"
          ls -la "$out" "$out/shaders"
      - name: Does it start? (pictures of its frame)
        shell: pwsh
        run: |
          function Shot($name, $extra) {
            $p = Start-Process -FilePath dist/LiquidGlass/LiquidGlass.exe -ArgumentList (@('--shot', "$PWD/$name") + $extra) -WorkingDirectory dist/LiquidGlass -PassThru
            if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw "$name did not finish" }
            Write-Host "$name exit code: $($p.ExitCode)"
            if (Test-Path "$name.txt") { Get-Content "$name.txt" }
            if (-not (Test-Path $name)) { throw "no picture: $name" }
          }
          Shot 'shot-showcase.png' @()                                 # the grid test card
          Shot 'shot-showcase-200.png' @('--dpi', '192')               # as on a display scaled 200%: everything at one scale
          Shot 'shot-showcase-photo.png' @('--backdrop', 'photo')      # a photo Windows carries, at full resolution
          Shot 'shot-showcase-clear.png' @('--frost', '0')             # every panel clear: the bending at each rim
      - name: Zip
        shell: bash
        run: (cd dist && 7z a -tzip -mx=9 ../LiquidGlass-Showcase-win64.zip LiquidGlass >/dev/null) && ls -la LiquidGlass-Showcase-win64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-showcase
          path: shot-showcase*
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-Showcase-win64
          path: LiquidGlass-Showcase-win64.zip

  publish:
    name: Publish the pre-release
    needs: [showcase]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: zips
          pattern: LiquidGlass-*
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (numbered so the newest sorts first: windows-glass-v013 after windows-glass-v012; the older r tags sort below)
          n=$(printf '%03d' "${{ github.run_number }}")
          tag="windows-glass-v$n"
          gh release create "$tag" zips/*.zip --target "${{ github.sha }}" --prerelease \
            --title "Liquid Glass on Windows — native, on AuroraGlass (v$n)" \
            --notes-file windows-glass/RELEASE_NOTES.md
          echo "https://github.com/${{ github.repository }}/releases/tag/$tag"
