          Shot 'pin-ptable' '1366x778' 45 ($mock + @('--appearance', 'light', '--pin', 'ptable', '--pin-open', 'ptable', '--ptable-pin-element', '25'))
          Shot 'lewis-sheet' '1366x778' 45 ($mock + @('--appearance', 'dark', '--lewis', 'Benzene'))
          Shot 'molecule-sheet' '1024x681' 45 ($mock + @('--appearance', 'light', '--molecule', 'CH4'))
          Shot 'tool-convert' '1366x778' 50 ($mock + @('--appearance', 'light', '--place', 'tools', '--tool', 'conv', '--tool-file', 'sample'))
