          # Atoms & Orbitals opened from iron's facts page: the Periodic Table's popup turned into it (ToolPopup.Change
          # writes "tool popup changed to: …" in a picture run), showing iron (the tool writes "atoms: shows …")
          if ($script:mine -contains 'chem-atom-from-element') {
            $l = PhoneLog 'chem-atom-from-element'
            Write-Host "chem-atom-from-element: $((@($l -split "`n" | Where-Object { $_ -match 'tool popup|atoms: shows' }) -join ' | '))"
            if (-not $l.Contains('tool popup changed to: atom') -or -not $l.Contains('atoms: shows Fe')) { Write-Host "::error::chem-atom-from-element: iron's facts page did not hand its element to Atoms & Orbitals (shots/profile-chem-atom-from-element.log)"; exit 1 }
          }
