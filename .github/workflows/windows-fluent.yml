          Shot 'dashboard-overdue-none' '1024x681' 45 ($mock + @('--appearance', 'light', '--overdue-none'))
          Shot 'dashboard-overdue-none-dark' '1024x681' 45 ($mock + @('--appearance', 'dark', '--overdue-none'))
          Shot 'dashboard-counter-morph-overdue' '1024x681' 45 ($mock + @('--appearance', 'dark', '--sheet', 'overdue', '--open', 'sheetmorph'))
          # (the wider popups' review) a tool's popup at the least a student can size it to (480 by 340), and one a student
          # sized larger than a later, smaller window: held to that window's room, 748 by 603 on a 780 window (checked below)
          Shot 'wide-dna-least' '1366x778' 50 ($mock + @('--appearance', 'dark', '--place', 'tools', '--tool', 'dna', '--popup-size', '480x340'))
          Shot 'wide-cell-kept-small' '780x683' 50 ($mock + @('--appearance', 'light', '--place', 'tools', '--tool', 'cell', '--popup-size', '1300x700'))
          # a pin's flyout used as a student uses it — opened as a press opens it (not kept for its picture), clicked in
          # and typed in (Tools/ToolHost.cs, PinTry) — alone on the runner, so no other copy of Simpl takes the window's
