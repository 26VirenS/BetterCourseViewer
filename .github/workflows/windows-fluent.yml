          # Send from Phone, tried as a phone would (one part each): Simpl's hand-in panel with --phone-test says its
          # server's address in simpl.log (on 127.0.0.1 too); the page is opened, a wrong key tried, then each file posted
          # as the phone's page posts it (X-File-Name, its type, its length) with Invoke-WebRequest; what came back goes
          # in shots/phone-test.txt, and the log must then say each file is in the hand-in (checked below)
          function PhoneTest($name, $part, $extra, $sends) {
            if ($shard -ne $part) { return }
            $script:mine += $name
            while (@($script:running | Where-Object { -not $_.HasExited }).Count -ge 3) { Start-Sleep -Milliseconds 400 }
            $prof = Join-Path $env:RUNNER_TEMP "profile-$name"
            $argList = @('--shot', "$PWD/shots/$name.png", '--shot-after', '90', '--profile', $prof, '--window-size', '1024x681') + $mock + $extra + @('--phone', '--phone-test')
            $script:running += Start-Process -FilePath dist/Simpl/Simpl.exe -ArgumentList $argList -PassThru
            $log = Join-Path $prof 'simpl.log'
            $url = $null
            for ($i = 0; $i -lt 480 -and -not $url; $i++) {
              Start-Sleep -Milliseconds 250
              if (Test-Path $log) { $m = Select-String -Path $log -Pattern 'phone hand-in: test address (\S+)' | Select-Object -First 1; if ($m) { $url = $m.Matches[0].Groups[1].Value } }
            }
            if (-not $url) { "${name}: no address in the log" | Add-Content shots/phone-test.txt; return }
            $base = $url -replace '[^/]+/$', ''
            $page = (Invoke-WebRequest -Uri $url -SkipHttpErrorCheck -TimeoutSec 15).StatusCode
            $wrong = (Invoke-WebRequest -Uri "${base}AAAAAAAAAAAAAAAAAAAAAA/" -SkipHttpErrorCheck -TimeoutSec 15).StatusCode
            Start-Sleep -Seconds 1
            $codes = @()
            foreach ($f in $sends) {
              $codes += (Invoke-WebRequest -Uri "${url}upload" -Method Post -InFile $f.Path -ContentType $f.Type -Headers @{ 'X-File-Name' = [uri]::EscapeDataString($f.Name) } -SkipHttpErrorCheck -TimeoutSec 30).StatusCode
              Start-Sleep -Milliseconds 600
            }
            "${name}: page $page, wrong key $wrong, uploads $($codes -join ' ')" | Add-Content shots/phone-test.txt
          }
          'Notes from class, sent from a phone.' | Set-Content -NoNewline "$env:RUNNER_TEMP/phone-notes.txt"
          'ID3 not really music' | Set-Content -NoNewline "$env:RUNNER_TEMP/phone-song.mp3"
          $photo = (Resolve-Path scripts/dev/fixtures/photo.jpg).Path
          PhoneTest 'hand-in-phone-connected' 6 @('--appearance', 'light', '--place', 'course:101', '--push', '/courses/101/assignments/1012', '--open', 'handin') @(
            @{ Path = $photo; Type = 'image/jpeg'; Name = 'Photo from phone.jpg' }, @{ Path = "$env:RUNNER_TEMP/phone-notes.txt"; Type = 'text/plain'; Name = 'Notes.txt' })
          # (an assignment narrowed to PDFs for this part's mock: its photos made one PDF, an mp3 refused)
          if ($shard -eq 7) { Invoke-WebRequest -Uri http://localhost:8800/__mock/config -Method Post -ContentType 'application/json' -Body '{"ext":{"1013":["pdf"]}}' | Out-Null }
          PhoneTest 'hand-in-phone-photos' 7 @('--appearance', 'dark', '--place', 'course:101', '--push', '/courses/101/assignments/1013', '--open', 'handin') @(
            @{ Path = $photo; Type = 'image/jpeg'; Name = 'IMG_0001.jpg' }, @{ Path = $photo; Type = 'image/jpeg'; Name = 'IMG_0002.jpg' }, @{ Path = "$env:RUNNER_TEMP/phone-song.mp3"; Type = 'audio/mpeg'; Name = 'Song.mp3' })
          foreach ($p in $script:running) { if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } }
          # (the pictures this part was to take, for the checks: each must be there — scripts/dev/check-shots.py)
          $script:mine | Set-Content "shots/expected-part-$shard.txt"
          Get-ChildItem shots -Filter *.png | ForEach-Object { Write-Host "shot $($_.BaseName)" }
          Get-ChildItem $env:RUNNER_TEMP -Filter 'profile-*' -Directory | ForEach-Object {
            $log = Join-Path $_.FullName 'simpl.log'
            if (Test-Path $log) { Copy-Item $log "shots/$($_.Name).log"; Write-Host "--- $($_.Name)"; Get-Content $log -Tail 25 }
            # (the page's own errors, when it had any: Support/PageErrors.cs, read by the checks)
