# Simpl for Mac (mac/): built with Xcode 26 for macOS, signed to run locally, and run against the mock Canvas: the
# main screens pictured (scripts/dev/mac-shots.sh), the pictures, the build's errors and the app itself pushed to the
# mac-shots branch to be looked at. Nothing is published here. A push takes the quick set (a dozen pictures, a few
# minutes) and a newer push cancels the run before it; every screen in light and dark ("full") is taken when a commit's
# message says [full shots], or by hand: Actions → Mac app → Run workflow → full. (1.3.1: built without an index; the
# pictures taken by four copies of the app at once, each as soon as it has settled — mac-shots.sh.)
name: Mac app

on:
  push:
    paths:
      - 'mac/**'
      - 'ios/SimplCourses/App/AppSession.swift'
      - 'ios/SimplCourses/App/SchoolPickerView.swift'
      - 'ios/SimplCourses/Native/Models.swift'
      - 'ios/SimplCourses/Native/CourseModels.swift'
      - 'ios/SimplCourses/Native/QuizModels.swift'
      - 'ios/SimplCourses/Native/QuizRun.swift'
      - 'ios/SimplCourses/Native/Reminders.swift'
      - 'ios/SimplCourses/Native/Activity.swift'
      - 'ios/SimplCourses/Native/Router.swift'
      - 'ios/SimplCourses/Web/**'
      - 'extension/content/app/native-app.js'
      - 'scripts/dev/make-mac-project.py'
      - 'scripts/dev/mac-shots.sh'
      - 'scripts/dev/mock-brightspace.mjs'
      - 'scripts/dev/check-shots.py'
      - 'scripts/dev/scan-logs.py'
      - 'scripts/dev/check-warnings.py'
      - 'scripts/dev/*-checks.json'
      - 'scripts/dev/baselines/mac-*'
      - 'scripts/dev/swift-checks/**'
      - '.github/workflows/mac.yml'
  workflow_dispatch:
    inputs:
      shots:
        description: 'Which pictures: quick (a dozen), full (every screen, light and dark), none (the build alone)'
        default: quick
        type: choice
        options: [quick, full, none]
      clean:
        description: 'Build from clean (every file compiled, so every warning is seen: the baseline of scripts/dev/check-warnings.py)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mac-app
  cancel-in-progress: true # (a newer push cancels the run before it: only the newest is worth waiting for)

jobs:
  # (the models that need no window, checked on their own beside the build — the elements' data, VSEPR's shapes and
  #  the biology toolkit's models and self-check (every Foundation-only file in mac/Simpl/Tools/Biology/Model, so a
  #  tool's builder adds files there without touching this): scripts/dev/swift-checks/main.swift compiled with the files
  #  it checks and run, in about a minute)
  models:
    name: Models
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mac/Simpl/Tools
            scripts/dev/swift-checks
      - name: The models' checks
        run: |
          swiftc -O -o "$RUNNER_TEMP/model-checks" mac/Simpl/Tools/PeriodicData.swift mac/Simpl/Tools/PeriodicExtraData.swift \
            mac/Simpl/Tools/MoleculeShape.swift mac/Simpl/Tools/Biology/Model/*.swift scripts/dev/swift-checks/main.swift
          "$RUNNER_TEMP/model-checks"

  mac:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: The project is what the generator writes
        run: |
          python3 scripts/dev/make-mac-project.py
          git diff --exit-code -- mac/Simpl.xcodeproj || { echo "::error::mac/Simpl.xcodeproj differs from scripts/dev/make-mac-project.py's"; exit 1; }
          # (1.3.3) the Mac's own What's New has an entry for this version, first
          v=$(sed -n "s/^MARKETING_VERSION = '\([^']*\)'.*/\1/p" scripts/dev/make-mac-project.py)
          n=$(grep -m1 -o 'Release(version: "[^"]*"' mac/Simpl/Support/MacWhatsNew.swift | sed 's/.*"\(.*\)"/\1/')
          [ "$v" = "$n" ] || { echo "::error::mac/Simpl/Support/MacWhatsNew.swift's newest entry is $n, the app is $v"; exit 1; }
      # (1.3.1) the last build's intermediates, and every file not changed since dated as it was then: only what changed
      # is compiled again (scripts/dev/mtime-cache.py)
      - name: The last build
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@v4
        with:
          path: build
          key: mac-debug-${{ github.sha }}
          restore-keys: mac-debug-
      - name: Unchanged files keep their dates
        run: python3 scripts/dev/mtime-cache.py restore build
      - name: Build for macOS
        run: |
          set -o pipefail
          xcodebuild -version
          mkdir -p shots
          build() {
            xcodebuild -project mac/Simpl.xcodeproj -scheme Simpl -configuration Debug -destination 'platform=macOS' \
              -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
              COMPILER_INDEX_STORE_ENABLE=NO ONLY_ACTIVE_ARCH=YES -showBuildTimingSummary build 2>&1 \
              | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          }
          build
          # (an incremental build that failed is tried once more from clean: a stale intermediate is never the answer)
          if ! grep -q "BUILD SUCCEEDED" build.log && [ -f build/.mtimes-ns.json ]; then
            echo "::warning::incremental build failed; building clean"
            rm -rf build
            build
          fi
          grep -E "error:" -B2 -A8 build.log | head -600 > shots/build-errors.txt || true
          grep -E "warning:.*mac/Simpl/" build.log | sort -u | head -300 > shots/build-warnings.txt || true
          sed -n '/Build Timing Summary/,$p' build.log | head -80 > shots/build-timing.txt || true
          grep -q "BUILD SUCCEEDED" build.log || { echo "build failed" > shots/FAILED; cat shots/build-errors.txt | head -300; }
      - name: Keep this build for the next
        if: hashFiles('shots/FAILED') == ''
        run: python3 scripts/dev/mtime-cache.py save build
      - name: Save the build
        if: hashFiles('shots/FAILED') == ''
        uses: actions/cache/save@v4
        with:
          path: build
          key: mac-debug-${{ github.sha }}
      - name: Mock Canvas
        if: hashFiles('shots/FAILED') == ''
        run: |
          node scripts/dev/mock-canvas.mjs 8800 8801 > mock.log 2>&1 &
          node scripts/dev/mock-canvas.mjs 8802 8803 --login > mock-login.log 2>&1 & # (one that asks for a sign-in first: the sign-in picture)
          node scripts/dev/mock-brightspace.mjs 8860 --open > mock-d2l.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "mock %{http_code}\n" http://localhost:8800/
          curl -s -o /dev/null -w "mock sign-in %{http_code}\n" http://localhost:8802/login/canvas
          curl -s -o /dev/null -w "mock brightspace %{http_code}\n" http://localhost:8860/d2l/home
          system_profiler SPDisplaysDataType | grep -E "Resolution|Display Type" || true
      - name: Screens
        if: hashFiles('shots/FAILED') == '' && (github.event.inputs.shots || 'quick') != 'none'
        env:
          SHOTS: ${{ github.event.inputs.shots || (contains(github.event.head_commit.message, '[full shots]') && 'full' || 'quick') }}
        run: bash scripts/dev/mac-shots.sh
      # (1.3.76) what the app kept while it was pictured is sealed by its vault (mac/Simpl/Support/Vault.swift), whose key
      # is kept in the login Keychain: the extension's storage, the kept answers and the flashcards each start "SIMPLENC".
      # The sign-in and the cookies are Keychain items of their own, so no login.bin or cookies.bin may be found (an
      # early 1.3.76 build's files). Each worker of mac-shots.sh has a home of its own (/tmp/simpl-shots.*/home*); this
      # Mac's own home is looked in too. Where the vault's key is (vault.key's mode) is printed: "keychain", or "file"
      # when the runner's Keychain would not take it (a notice, not a failure); "se" (the Secure Enclave) fails.
      - name: Kept data is encrypted
        if: hashFiles('shots/FAILED') == '' && (github.event.inputs.shots || 'quick') != 'none'
        run: |
          dirs=()
          enclave=0
          for h in /tmp/simpl-shots.*/home* "$HOME"; do
            for d in "Application Support/SimplCourses" "Application Support/com.simplcourses.mac" "Application Support/Simpl" "Caches/Answers"; do
              if [ -d "$h/Library/$d" ]; then dirs+=("$h/Library/$d"); fi
            done
            key="$h/Library/Application Support/Simpl/vault.key"
            if [ -f "$key" ]; then
              mode="$(grep -o '"mode":"[a-z]*"' "$key" | cut -d'"' -f4 || true)"
              echo "vault.key in $h: mode ${mode:-unknown}"
              if [ "$mode" = file ]; then echo "::notice::the vault's key in $h is in vault.key itself: this runner's Keychain would not take it"; fi
              if [ "$mode" = se ]; then enclave=$((enclave + 1)); echo "::error::the vault's key in $h is still held by the Secure Enclave"; fi
            fi
          done
          if [ ${#dirs[@]} -eq 0 ]; then echo "::warning::no kept data found to check"; exit 0; fi
          checked=0
          plain=0
          while IFS= read -r -d '' f; do
            checked=$((checked + 1))
            if [ "$(head -c 8 "$f")" != SIMPLENC ]; then plain=$((plain + 1)); echo "::error::not encrypted: $f"; fi
          done < <(find "${dirs[@]}" -type f -size +0 \( -name storage.json -o -name flashcards.json -o -path '*/Caches/Answers/*' \) -print0)
          outside=0
          while IFS= read -r -d '' f; do
            outside=$((outside + 1))
            echo "::error::kept outside the Keychain: $f"
          done < <(find "${dirs[@]}" -type f \( -name login.bin -o -name cookies.bin \) -print0)
          echo "$checked kept files checked, $plain not encrypted; $outside sign-in or cookie files outside the Keychain"
          if [ "$checked" -eq 0 ]; then echo "::warning::no kept data found to check"; fi
          [ "$plain" -eq 0 ] && [ "$outside" -eq 0 ] && [ "$enclave" -eq 0 ]
      # (1.3.78) Send from Phone: mac-shots.sh sent files to Hand In's own server as a phone's page does — the page
      # opened, a wrong key refused, a photo and a text file taken, a PDF-only assignment's photos made into one PDF and
      # an mp3 refused — and read the app's consoles for them in the hand-in (shots/phone-check.txt)
      - name: Send from Phone took the files
        if: hashFiles('shots/FAILED') == '' && (github.event.inputs.shots || (contains(github.event.head_commit.message, '[full shots]') && 'full' || 'quick')) == 'quick'
        run: |
          cat shots/phone-test.txt 2>/dev/null || true
          test -s shots/phone-check.txt || { echo "::error::mac-shots.sh wrote no phone-check.txt"; exit 1; }
          if grep -q '^FAIL' shots/phone-check.txt; then grep '^FAIL' shots/phone-check.txt | sed 's/^/::error::/'; exit 1; fi
      # (what the run made, read before anyone has to, each check whatever the others found — docs/CI.md: every picture
      #  there and showing something, scripts/dev/check-shots.py; the app's consoles free of exceptions, crashes and
      #  errors, scan-logs.py; no compiler warning that is not already known, check-warnings.py. Their lists of what is
      #  plain or harmless on purpose are shot-checks.json, log-checks.json and baselines/, each entry with its reason.)
      - name: Every picture shows something
        if: ${{ !cancelled() && hashFiles('shots/FAILED') == '' && (github.event.inputs.shots || 'quick') != 'none' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/py" && "$RUNNER_TEMP/py/bin/pip" install -q pillow
          "$RUNNER_TEMP/py/bin/python" scripts/dev/check-shots.py shots --app mac --pattern '*-app.png' --expect shots/shot-times.txt --report shots/shot-checks.txt
      - name: The consoles are clean
        if: ${{ !cancelled() && hashFiles('shots/FAILED') == '' && (github.event.inputs.shots || 'quick') != 'none' }}
        run: python3 scripts/dev/scan-logs.py --app mac 'shots/console-*.txt' 'shots/crash-*.txt'
      - name: No new compiler warnings
        if: ${{ !cancelled() && hashFiles('shots/FAILED') == '' && hashFiles('build.log') != '' }}
        run: python3 scripts/dev/check-warnings.py build.log --baseline scripts/dev/baselines/mac-warnings.txt
      - name: Push the pictures to the mac-shots branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          tail -c 900000 build.log > shots/build-tail.log 2>/dev/null || true
          [ -d build/Build/Products/Debug/Simpl.app ] && (cd build/Build/Products/Debug && ditto -c -k --keepParent Simpl.app "$GITHUB_WORKSPACE/shots/Simpl.app.zip") || true
          echo "${GITHUB_SHA}" > shots/COMMIT
          cd shots
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b mac-shots
          git add -A
          git commit -qm "Mac screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mac-shots && echo PUSHED
      - name: The build passed
        run: test ! -f shots/FAILED
