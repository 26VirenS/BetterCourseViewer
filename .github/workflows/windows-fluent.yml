# Simpl for Windows, made again in Windows 11's look (windows/SimplFluent: WPF with WPF-UI — Mica, the Settings app's
# navigation and cards, Fluent icons): built on a Windows runner, made into an installer (Simpl-Setup.exe, Inno Setup:
# windows/SimplFluent/Installer/Simpl.iss) that is tried — installed, opened, pictured, an update that comes by itself
# (held by a quiz, put in once it closes, Simpl opened again where it was), updated over an open Simpl as Restart to
# Update runs it, an update that cannot finish, uninstalled with Simpl open, installed again and uninstalled from
# Simpl's own Settings — pictured against
# the mock Canvas, and — when a commit asks for it with "[preview]" in its message, or by hand (Run workflow) —
# published as a pre-release (windows-fluent-v<run>, zero-padded; Simpl-Setup.exe and the portable zip) to try on a
# real PC. The first Windows app (windows/Simpl, windows-app-v*) and Simpl's Mac and iPhone builds, releases and update
# feeds are not touched.
# Built once (the installer and the zip a release carries); then, at the same time, the pictures in four parts and the
# installer tried; a release publishes that one build (windows-fluent-ship.yml publishes a green run's, by hand). Beside
# them, the performance walk, which only reports: no release waits for it.
name: Windows app (Windows 11 look)

on:
  push:
    branches: [claude/windows-liquid-glass]
    paths:
      - 'windows/SimplFluent/**'
      - '.github/workflows/windows-fluent.yml'
  workflow_dispatch:
    inputs:
      preview:
        description: Publish the build as a preview release
        type: boolean
        default: true
      reuse:
        description: Publish the green run already made for this commit, if there is one (no build again)
        type: boolean
        default: true
      from_run:
        description: Or publish this green run (its id), whatever its commit
        type: string
        default: ''
      critical:
        description: A Critical Update (every installed Simpl puts it in at its next check, whatever its update settings)
        type: boolean
        default: false

permissions:
  contents: write
  actions: read # (a green run found, and its build downloaded, to publish it)

concurrency:
  # (pushes one after another; a publish beside them, never queued behind a build it does not need)
  group: windows-fluent-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # (Run workflow, to publish: the run a push already made for this commit, once it is green, is published as it is —
  #  a minute, not a build and its pictures again; without one, or with reuse off, it is built and tried here)
  prior:
    name: The run already made for this commit
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.preview && inputs.reuse }}
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.find.outputs.found }}
      run: ${{ steps.find.outputs.run }}
      number: ${{ steps.find.outputs.number }}
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RUN: ${{ inputs.from_run }}
        run: |
          api="repos/${{ github.repository }}/actions/workflows/windows-fluent.yml/runs?head_sha=${{ github.sha }}&event=push&per_page=5"
          q='.workflow_runs[0] | "\(.id) \(.run_number) \(.status) \(.conclusion) \(.head_sha)"'
          if [ -n "$FROM_RUN" ]; then api="repos/${{ github.repository }}/actions/runs/$FROM_RUN"; q='"\(.id) \(.run_number) \(.status) \(.conclusion) \(.head_sha)"'; fi
          # (a push's run still going is waited for, up to half an hour)
          for i in $(seq 1 120); do
            read -r id number status conclusion sha < <(gh api "$api" --jq "$q" 2>/dev/null || echo "")
            [ -z "$id" ] || [ "$id" = "null" ] && { echo "no push run for this commit: built here"; echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; }
            [ "$status" = "completed" ] && break
            echo "run $id is $status: waiting"; sleep 15
          done
          if [ "$conclusion" != "success" ]; then echo "::error::the run for this commit ($id) ended $conclusion: not published"; exit 1; fi
          echo "found=true" >> "$GITHUB_OUTPUT"; echo "run=$id" >> "$GITHUB_OUTPUT"; echo "number=$number" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "publishing run $id (v$(printf '%03d' "$number"))"

  build:
    name: Build (the app, its zip)
    needs: prior
    if: ${{ !cancelled() && needs.prior.outputs.found != 'true' && needs.prior.result != 'failure' }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # (Azure signed in to, to sign, when the repository can)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # (the packages the build restores, kept between runs)
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/SimplFluent/SimplFluent.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build (Release, win-x64, self-contained)
        shell: bash
        run: |
          # (the number the build carries — "0.2.3 (v041)" — is its own run's: the one published, when it is reused)
          n=$(printf '%03d' "${{ needs.prior.outputs.number || github.run_number }}")
          # (the version is the project's own — SimplFluent.csproj's <Version> — so a new version never touches this file)
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' windows/SimplFluent/SimplFluent.csproj | head -1)
          test -n "$v"
          dotnet publish windows/SimplFluent/SimplFluent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/Simpl -nologo "-p:InformationalVersion=$v (v$n)"
          test -f dist/Simpl/Simpl.exe
      # signed, once the repository has an Artifact Signing account (windows/SimplFluent/README.md, Signing: its six
      # Actions variables): Azure signed in to without a secret (OIDC), then signtool and Artifact Signing's dlib
      - name: Azure, to sign
        if: ${{ vars.SIGNING_ACCOUNT != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Signing tools
        if: ${{ vars.SIGNING_ACCOUNT != '' }}
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sign'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $nuget = (Get-Command nuget.exe -ErrorAction SilentlyContinue).Source
          if (-not $nuget) { $nuget = Join-Path $dir 'nuget.exe'; Invoke-WebRequest https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile $nuget }
          & $nuget install Microsoft.Windows.SDK.BuildTools -x -OutputDirectory $dir -NonInteractive | Out-Null
          & $nuget install Microsoft.ArtifactSigning.Client -x -OutputDirectory $dir -NonInteractive | Out-Null
          $signtool = Get-ChildItem $dir -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          $dlib = Get-ChildItem $dir -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $signtool -or -not $dlib) { Write-Host "::error::signtool or Artifact Signing's dlib not found"; exit 1 }
          # (signed in as azure/login left it: the Azure CLI's sign-in, the others not tried)
          $metadata = Join-Path $dir 'metadata.json'
          @{
            Endpoint = $env:SIGNING_ENDPOINT; CodeSigningAccountName = $env:SIGNING_ACCOUNT; CertificateProfileName = $env:SIGNING_PROFILE
            CorrelationId = "${{ github.run_id }}"
            ExcludeCredentials = @('ManagedIdentityCredential', 'WorkloadIdentityCredential', 'SharedTokenCacheCredential',
              'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
          } | ConvertTo-Json | Set-Content $metadata
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "SIGN_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
          "SIGN_METADATA=$metadata" >> $env:GITHUB_ENV
          Write-Host "signtool: $($signtool.FullName)"; Write-Host "dlib: $($dlib.FullName)"
      # (each of the app's files that no one signed — Simpl's own, WPF-UI's, PDFsharp's — signed: the zip and the
      #  installer carry them signed; .NET's and WebView2's are Microsoft's already)
      - name: Sign
        if: ${{ vars.SIGNING_ACCOUNT != '' }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist/Simpl -Recurse -Include *.exe, *.dll | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq 'NotSigned' } | ForEach-Object FullName)
          Write-Host "signing $($files.Count) files:"; $files | ForEach-Object { Write-Host "  $_" }
          if ($files.Count -eq 0) { exit 0 }
          & $env:SIGNTOOL sign /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $env:SIGN_DLIB /dmdf $env:SIGN_METADATA @files
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::signing failed ($LASTEXITCODE)"; exit 1 }
          $bad = @($files | Where-Object { (Get-AuthenticodeSignature $_).Status -ne 'Valid' })
          if ($bad.Count -gt 0) { Write-Host "::error::not signed: $($bad -join ', ')"; exit 1 }
          Write-Host "signed by $((Get-AuthenticodeSignature dist/Simpl/Simpl.exe).SignerCertificate.Subject)"
      - name: Zip
        shell: bash
        run: (cd dist && 7z a -tzip -mx=5 ../Simpl-Windows-x64.zip Simpl >/dev/null) && mv Simpl-Windows-x64.zip dist/ && ls -la dist/Simpl-Windows-x64.zip
      # (the build, as the portable zip a release carries: pictured, made into the installer and tried, released — one
      #  build; the installer is made beside the pictures, by the job that tries it)
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/Simpl-Windows-x64.zip
          compression-level: 0
          retention-days: 30

  pictures:
    name: Pictures (part ${{ matrix.shard }})
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      # (the mock Canvas is all the pictures take from the repository; Node is on the image)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/dev
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: The build
        shell: bash
        run: (cd dist && 7z x -y Simpl-Windows-x64.zip >/dev/null) && test -f dist/Simpl/Simpl.exe && ls dist
      - name: Mock Canvas
        shell: bash
        run: |
          node scripts/dev/mock-canvas.mjs 8800 8801 > mock.log 2>&1 &
          # (a second one that asks for a sign-in first: the sign-in pictures)
          node scripts/dev/mock-canvas.mjs 8802 8803 --login > mock-login.log 2>&1 &
          # (up when it answers — a cold runner's Node may take a few seconds — not after a set time)
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8800/ && curl -s -o /dev/null http://localhost:8802/login/canvas && break; sleep 0.5; done
          curl -s -o /dev/null -w "mock %{http_code}\n" http://localhost:8800/
          curl -s -o /dev/null -w "mock sign-in %{http_code}\n" http://localhost:8802/login/canvas
      - name: Pictures
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; Write-Host "display 1920x1080" } catch { Write-Host "display left as it is: $_" }
          New-Item -ItemType Directory -Force shots | Out-Null
          # (three at a time, each with a profile of its own: each copy of Simpl pictures its own window, then quits)
          $script:running = @()
          # (this job's share of the pictures: every SHARDS-th, from SHARD — eight jobs at once, each three at a time)
          $shard = [int]$env:SHARD; $shards = [int]$env:SHARDS
          $script:k = -1; $script:mine = @()
          function Shot($name, $size, $wait, $extra) {
            $script:k++
            if ($script:k % $shards -ne $shard) { return }
            $script:mine += $name
            while (@($script:running | Where-Object { -not $_.HasExited }).Count -ge 3) { Start-Sleep -Milliseconds 400 }
            $prof = Join-Path $env:RUNNER_TEMP "profile-$name"
            $argList = @('--shot', "$PWD/shots/$name.png", '--shot-after', "$wait", '--profile', $prof, '--window-size', $size) + $extra
            $script:running += Start-Process -FilePath dist/Simpl/Simpl.exe -ArgumentList $argList -PassThru
          }
          $mock = @('--base-url', 'http://localhost:8800', '--demo')
          $login = @('--base-url', 'http://localhost:8802', '--demo')
          # the first run: finding the school, and the school confirmed
          Shot 'school-picker-dark' '1024x681' 8 @('--appearance', 'dark')
          Shot 'school-picker-light' '1024x681' 8 @('--appearance', 'light')
          Shot 'school-search' '1024x681' 10 @('--appearance', 'light', '--picker-query', 'state')
          Shot 'school-confirm' '1024x681' 10 @('--appearance', 'dark', '--picker-query', 'state', '--picker-confirm')
          # signing in (the mock with --login): the card, a wrong password, "Logging you in", "Stay logged in?", a page
          # finished by hand (a one-time code)
          Shot 'sign-in-dark' '1024x681' 14 ($login + @('--appearance', 'dark'))
          Shot 'sign-in-light' '1024x681' 14 ($login + @('--appearance', 'light'))
          Shot 'sign-in-light-wide' '1366x778' 14 ($login + @('--appearance', 'light'))
          Shot 'sign-in-wrong' '1024x681' 16 ($login + @('--appearance', 'light', '--sign-in', 'student:wrong'))
          Shot 'sign-in-working' '1024x681' 14 ($login + @('--appearance', 'light', '--sign-in', 'slow:demo'))
          Shot 'sign-in-stay' '1024x681' 40 ($login + @('--appearance', 'dark', '--sign-in', 'student:demo'))
          Shot 'sign-in-handoff' '1024x681' 18 ($login + @('--appearance', 'light', '--sign-in', 'code:demo'))
          # the app: the Dashboard (light, dark, the user's window size, narrow with the pane open), the account menu,
          # What's New
          Shot 'dashboard-dark' '1024x681' 45 ($mock + @('--appearance', 'dark'))
          Shot 'dashboard-light' '1024x681' 45 ($mock + @('--appearance', 'light'))
          Shot 'dashboard-light-wide' '1366x778' 45 ($mock + @('--appearance', 'light'))
          Shot 'dashboard-dark-wide' '1366x778' 45 ($mock + @('--appearance', 'dark'))
          Shot 'dashboard-cards-wide' '1366x778' 45 ($mock + @('--appearance', 'dark', '--dash-view', 'cards'))
          Shot 'dashboard-activity' '1024x681' 45 ($mock + @('--appearance', 'light', '--dash-view', 'activity'))
          Shot 'dashboard-counter' '1024x681' 45 ($mock + @('--appearance', 'light', '--sheet', 'next'))
          Shot 'dashboard-counter-dark' '1366x778' 45 ($mock + @('--appearance', 'dark', '--sheet', 'unread'))
          Shot 'dashboard-1080p' '1920x1050' 45 ($mock + @('--appearance', 'dark'))
          Shot 'grades-1080p' '1920x1050' 45 ($mock + @('--appearance', 'light', '--place', 'grades'))
          Shot 'dashboard-narrow' '780x683' 45 ($mock + @('--appearance', 'light'))
          Shot 'dashboard-narrow-pane' '780x683' 45 ($mock + @('--appearance', 'dark', '--pane-open'))
          Shot 'course-open' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'course:101'))
          Shot 'account-menu' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'menu'))
          Shot 'whats-new' '1024x681' 45 ($mock + @('--appearance', 'dark', '--open', 'whatsnew'))
          Shot 'setup' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'setup'))
          # (setup run to its end and saved, as Start using Simpl does: its log is checked below for a save that failed)
          Shot 'setup-saved' '1024x681' 45 ($mock + @('--appearance', 'dark', '--open', 'setup', '--setup-save', 'yes'))
          Shot 'preview' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'preview'))
          Shot 'tour-start' '1024x681' 45 ($mock + @('--appearance', 'dark', '--open', 'tour'))
          Shot 'tour-counter' '1366x778' 45 ($mock + @('--appearance', 'light', '--open', 'tour:12'))
          Shot 'tour-score' '1280x600' 45 ($mock + @('--appearance', 'dark', '--place', 'section:courses/101:grades', '--what-if', '--open', 'tour:6'))
          Shot 'taskbar-ask' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'taskbar'))
          Shot 'theme-dusk' '1366x778' 45 ($mock + @('--appearance', 'dark', '--theme', 'Dusk'))
          # To Do, Calendar, Notifications
          Shot 'todo' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'todo'))
          Shot 'todo-wide' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'todo'))
          Shot 'todo-preview' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'todo', '--open', 'preview'))
          Shot 'new-task' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'todo', '--open', 'newtask'))
          Shot 'calendar' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'calendar'))
          Shot 'calendar-wide' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'calendar'))
          Shot 'calendar-week' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'calendar', '--cal-view', 'week'))
          Shot 'calendar-list' '1024x681' 45 ($mock + @('--appearance', 'dark', '--place', 'calendar', '--cal-view', 'list'))
          Shot 'calendar-preview' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'calendar', '--open', 'preview'))
          Shot 'notifications' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'notifications'))
          Shot 'notifications-narrow' '1024x681' 45 ($mock + @('--appearance', 'dark', '--place', 'notifications'))
          # Grades, a course's grades and What-If
          Shot 'grades' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'grades'))
          Shot 'grades-narrow' '1024x681' 45 ($mock + @('--appearance', 'dark', '--place', 'grades'))
          Shot 'grades-scale' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'grades', '--open', 'grading-scale'))
          Shot 'course-grades' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'section:courses/101:grades'))
          Shot 'course-grades-whatif' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'section:courses/101:grades', '--what-if'))
          # Inbox, a conversation, New Message, Groups
          Shot 'inbox' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'inbox'))
          Shot 'inbox-reading' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'inbox', '--open', 'conversation:c2'))
          Shot 'inbox-narrow' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'inbox'))
          Shot 'compose' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'compose'))
          Shot 'groups' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'groups'))
          # All Courses, a group's home, a course's sections, a page, files
          Shot 'courses' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'courses'))
          Shot 'group-home' '1024x681' 45 ($mock + @('--appearance', 'dark', '--place', 'group:66729'))
          Shot 'section-announcements' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'section:courses/101:announcements'))
          Shot 'section-assignments' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'section:courses/101:assignments'))
          Shot 'section-modules' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'section:courses/102:modules'))
          Shot 'section-people' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'section:courses/101:people'))
          Shot 'section-files' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'section:courses/101:files', '--open', 'file:f1'))
          Shot 'page' '1024x681' 45 ($mock + @('--appearance', 'light', '--push', '/courses/101/pages/chapter-4-notes'))
          # Search, External Tools, Tools (pins in the title bar, a pin's flyout, a tool open), a discussion
          Shot 'search' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'search:discussion'))
          Shot 'search-start' '1024x681' 45 ($mock + @('--appearance', 'dark', '--place', 'search'))
          Shot 'palette-commands' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'palette:/'))
          Shot 'palette-course' '1024x681' 45 ($mock + @('--appearance', 'dark', '--open', 'palette:phys'))
          Shot 'palette-sum' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'palette:12*4'))
          Shot 'palette-grades' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'palette:/grades_'))
          Shot 'palette-narrow' '780x683' 45 ($mock + @('--appearance', 'dark', '--pane-open', '--open', 'palette:/'))
          Shot 'external-tools' '1024x681' 45 ($mock + @('--appearance', 'light', '--place', 'externaltools'))
          # (a tool used in assignments, its card pressed: the list of every place it is used, to choose the one to open)
          Shot 'external-tools-list' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'externaltools', '--tool-list', 'knewton'))
          Shot 'external-tools-list-dark' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'externaltools', '--tool-list', 'knewton'))
          Shot 'tools' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'tools', '--pin', 'calc,ptable,pomo'))
          Shot 'tools-pin' '1366x778' 45 ($mock + @('--appearance', 'dark', '--pin', 'calc,ptable,pomo', '--pin-open', 'calc', '--calc-expr', '2^10'))
          Shot 'tool-open' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'tools', '--tool', 'calc', '--calc-expr', 'sin(30)+sqrt(16)='))
          Shot 'tool-timer' '1366x778' 45 ($mock + @('--appearance', 'dark', '--focus-start', '--place', 'tools', '--tool', 'pomo'))
          Shot 'tools-live' '1024x681' 45 ($mock + @('--appearance', 'light', '--focus-start', '--place', 'tools'))
          Shot 'pin-timer' '1366x778' 45 ($mock + @('--appearance', 'light', '--focus-start', '--pin', 'pomo,calc', '--pin-open', 'pomo'))
          Shot 'tool-units' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'tools', '--tool', 'units', '--units-kind', 'temperature', '--units-value', '100'))
          Shot 'tool-need' '1366x778' 45 ($mock + @('--appearance', 'dark', '--place', 'tools', '--tool', 'need'))
          Shot 'pin-need' '1366x778' 45 ($mock + @('--appearance', 'light', '--pin', 'need', '--pin-open', 'need', '--need-numbers', '88,25,90'))
          Shot 'tool-cite' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'tools', '--tool', 'cite', '--cite-demo'))
          Shot 'tool-cite-partial' '1024x681' 45 ($mock + @('--appearance', 'dark', '--place', 'tools', '--tool', 'cite', '--cite-demo', 'partial', '--cite-style', 'apa'))
          Shot 'pin-cite' '1366x778' 45 ($mock + @('--appearance', 'light', '--pin', 'cite,fc', '--pin-open', 'cite', '--cite-demo'))
          Shot 'tool-flashcards' '1366x778' 45 ($mock + @('--appearance', 'light', '--place', 'tools', '--tool', 'fc', '--fc-demo'))
          Shot 'tool-flashcards-set' '1024x681' 45 ($mock + @('--appearance', 'dark', '--place', 'tools', '--tool', 'fc', '--fc-demo', 'set'))
