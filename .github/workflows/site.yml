# The website: site/ laid over the site branch, which Cloudflare deploys (scripts/publish-site.sh) — whenever site/
# changes on the default branch, after a Simpl for Mac release (its download address, /download/mac-app) or a run of
# the Windows app's workflow (its installer, /download/windows), when a
# release is published, promoted, edited or deleted by hand, every hour (so the download addresses and update feeds
# always point at the newest builds), or by hand (Actions → Site → Run workflow). The Package workflow does the same at
# every release.
name: Site

on:
  push:
    paths:
      - 'site/**'
      - 'scripts/publish-site.sh'
      - '.github/workflows/site.yml'
  # (a Windows preview's release is made by the Windows workflow on its own branch, whose tag carries no Site workflow
  # of this kind: the Windows download address, /download/windows, follows it from here)
  workflow_run:
    workflows: ['Simpl for Mac release', 'Windows app (Windows 11 look)']
    types: [completed]
  # a release published, promoted from beta, edited, taken back or deleted by hand: the download addresses and the
  # update feeds follow it at once
  release:
    types: [published, released, prereleased, edited, unpublished, deleted]
  # and every hour, so the site always catches up whatever was missed (nothing is pushed when nothing changed)
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-branch
  cancel-in-progress: false

jobs:
  publish:
    if: (github.event_name == 'release' || github.ref_name == github.event.repository.default_branch) && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      # (always the default branch's site/: a release's own tag may be an older commit)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Publish site/ to the site branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-site.sh
