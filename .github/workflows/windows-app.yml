# Simpl for Windows (windows/Simpl): built on a Windows runner (.NET 8, WPF; the screens drawn by Simpl's own renderer
# with Simpl's glass — windows/Shared/Glass.hlsl, the showcase's), pictured against the mock Canvas, and published as a
# pre-release (windows-app-v<run>, zero-padded) to try on a real PC. Nothing here touches Simpl's Mac or iPhone
# builds, their releases or their update feeds (those read mac-v* releases only).
name: Windows app

on:
  push:
    branches: [claude/windows-liquid-glass]
    paths:
      - 'windows/Simpl/**'
      - 'windows/Shared/**'
      - '.github/workflows/windows-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-app
  cancel-in-progress: true

jobs:
  app:
    name: Simpl for Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build (Release, win-x64, self-contained)
        shell: bash
        run: |
          # (the build carries its run's number — "0.1.0 (v015)" — as About and Updates name it)
          n=$(printf '%03d' "${{ github.run_number }}")
          dotnet publish windows/Simpl/Simpl.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/Simpl -nologo "-p:InformationalVersion=0.1.0 (v$n)"
          ls dist/Simpl | head -50
          test -f dist/Simpl/Simpl.exe
      - name: Mock Canvas
        shell: bash
        run: |
          node scripts/dev/mock-canvas.mjs 8800 8801 > mock.log 2>&1 &
          # (a second one that asks for a sign-in first: the sign-in pictures)
          node scripts/dev/mock-canvas.mjs 8802 8803 --login > mock-login.log 2>&1 &
          sleep 3
          curl -s -o /dev/null -w "mock %{http_code}\n" http://localhost:8800/
          curl -s -o /dev/null -w "mock sign-in %{http_code}\n" http://localhost:8802/login/canvas
      - name: Pictures
        shell: pwsh
        run: |
          # a display big enough for a window the size of the user's (the runner's is 1024 × 768 unless it can be set)
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; Write-Host "display 1920x1080" } catch { Write-Host "display left as it is: $_" }
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name, $size, $wait, $extra) {
            $prof = Join-Path $env:RUNNER_TEMP "profile-$name"
            $argList = @('--shot', "$PWD/shots/$name.png", '--shot-after', "$wait", '--profile', $prof, '--window-size', $size) + $extra
            $p = Start-Process -FilePath dist/Simpl/Simpl.exe -ArgumentList $argList -PassThru
            if (-not $p.WaitForExit(($wait + 40) * 1000)) { Stop-Process -Id $p.Id -Force; Write-Host "$name did not finish" }
            if (Test-Path "shots/$name.png") { Write-Host "shot $name" } else { Write-Host "no picture: $name" }
          }
          $mock = @('--base-url', 'http://localhost:8800', '--demo')
          # the Mac's own pictures are 1024 × 681 (its CI); the user's window is 1366 × 778
          Shot 'dashboard-dark' '1024x681' 45 ($mock + @('--appearance', 'dark'))
          Shot 'dashboard-light' '1024x681' 45 ($mock + @('--appearance', 'light'))
          Shot 'dashboard-dark-wide' '1366x778' 45 ($mock + @('--appearance', 'dark'))
          Shot 'dashboard-light-wide' '1366x778' 45 ($mock + @('--appearance', 'light'))
          Shot 'dashboard-counter' '1024x681' 45 ($mock + @('--appearance', 'light', '--sheet', 'next'))
          Shot 'dashboard-cards-wide' '1366x778' 45 ($mock + @('--appearance', 'dark', '--dash-view', 'cards'))
          Shot 'dashboard-activity' '1024x681' 45 ($mock + @('--appearance', 'dark', '--dash-view', 'activity'))
          Shot 'dashboard-narrow' '780x683' 45 ($mock + @('--appearance', 'light'))
          Shot 'school-picker' '1024x681' 10 @('--appearance', 'dark')
          # the account menu, What's New, and the Settings window (pictured alone, as the Mac's is) on each of its tabs
          Shot 'account-menu' '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'menu'))
          Shot 'whats-new' '1024x681' 45 ($mock + @('--appearance', 'dark', '--open', 'whatsnew'))
          foreach ($tab in @('general', 'appearance', 'notifications', 'grades', 'data', 'updates', 'about')) {
            Shot "settings-$tab" '1024x681' 45 ($mock + @('--appearance', 'light', '--open', 'settings', '--settings-tab', $tab))
          }
          Shot 'settings-appearance-dark' '1024x681' 45 ($mock + @('--appearance', 'dark', '--open', 'settings', '--settings-tab', 'appearance'))
          # the sign-in (the mock with --login, on :8802): the app's own card — light, dark, wide; the card again after a
          # wrong password; "Logging you in" with its offer (the login "slow" takes twelve seconds); "Stay logged in?"
          # once Canvas is reached; and the note over a page the student must finish by hand (a one-time code)
          $login = @('--base-url', 'http://localhost:8802', '--demo')
          Shot 'sign-in-dark' '1024x681' 14 ($login + @('--appearance', 'dark'))
          Shot 'sign-in-light' '1024x681' 14 ($login + @('--appearance', 'light'))
          Shot 'sign-in-light-wide' '1366x778' 14 ($login + @('--appearance', 'light'))
          Shot 'sign-in-wrong' '1024x681' 16 ($login + @('--appearance', 'light', '--sign-in', 'student:wrong'))
          Shot 'sign-in-working' '1024x681' 14 ($login + @('--appearance', 'light', '--sign-in', 'slow:demo'))
          Shot 'sign-in-stay' '1024x681' 40 ($login + @('--appearance', 'light', '--sign-in', 'student:demo'))
          Shot 'sign-in-handoff' '1024x681' 18 ($login + @('--appearance', 'light', '--sign-in', 'code:demo'))
          Get-ChildItem $env:RUNNER_TEMP -Filter 'profile-*' -Directory | ForEach-Object {
            $log = Join-Path $_.FullName 'simpl.log'
            if (Test-Path $log) { Copy-Item $log "shots/$($_.Name).log"; Write-Host "--- $($_.Name)"; Get-Content $log -Tail 30 }
          }
          Get-ChildItem shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-app-shots
          path: shots
      - name: Zip
        shell: bash
        run: (cd dist && 7z a -tzip -mx=7 ../Simpl-Windows-x64.zip Simpl >/dev/null) && ls -la Simpl-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Simpl-Windows-x64
          path: Simpl-Windows-x64.zip

  publish:
    name: Publish the pre-release
    needs: [app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Simpl-Windows-x64
          path: zips
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(printf '%03d' "${{ github.run_number }}")
          tag="windows-app-v$n"
          gh release create "$tag" zips/*.zip --target "${{ github.sha }}" --prerelease \
            --title "Simpl for Windows — preview (v$n)" \
            --notes-file windows/Simpl/RELEASE_NOTES.md
          echo "https://github.com/${{ github.repository }}/releases/tag/$tag"
