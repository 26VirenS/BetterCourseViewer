            if ($card -ne 'Fe') { Write-Host "::error::ptable-hover: the table's top showed '$card' when it was pictured, not Fe (shots/profile-ptable-hover.log)"; exit 1 }
            Write-Host "ptable-hover: the table's top showed $card"
