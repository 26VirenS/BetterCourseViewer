              if ($l -match 'ptable hover card: (\S+)') { $card = $Matches[1] }
            }
            if ($card -and $card -ne 'none') { Write-Host "::error::${still}: the table's top showed '$card' with nothing pointed at (shots/profile-$still.log)"; exit 1 }
